<html lang="en"><head><meta charset="utf-8">

<style>
/* Nothing on screen but the city: faint rings for the thumbs, a few words at the start. */
:root {
  --ink: #1b1a24; --paper: #f6f1e7; --soft: rgba(246,241,231,.55);
  --f-title: "Fraunces", Georgia, serif;
  --f-ui: "M PLUS Rounded 1c", "Trebuchet MS", system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: #b0cce0; color: var(--paper); font-family: var(--f-ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
html, body, canvas, #touch { touch-action: none; }
button, input { touch-action: manipulation; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
#touch { position: fixed; inset: 0; z-index: 2; }
#fade { position: fixed; inset: 0; z-index: 9; pointer-events: none; background: #0e1a24; opacity: 0; transition: opacity .6s ease; }
#fade.on { opacity: 1; }

/* thumbs: a faint ring for the stick, two faint circles for the buttons */
#stickbase { position: fixed; left: 0; top: 0; width: 128px; height: 128px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.04); z-index: 3; pointer-events: none; display: none; transition: opacity .8s; }
body.touch.playing #stickbase { display: block; left: calc(30px + var(--sal)); top: auto; bottom: calc(30px + var(--sab)); opacity: .5; }
body.touch.playing #stickbase.live { left: 0; top: 0; bottom: auto; opacity: .8; transition: none; }
#knob { position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.22); border: 1.5px solid rgba(255,255,255,.35); }
#buttons { position: fixed; right: calc(16px + var(--sar)); bottom: calc(18px + var(--sab)); width: 190px; height: 170px; z-index: 3; display: none; pointer-events: none; }
body.touch.playing #buttons { display: block; }
.pad-btn { pointer-events: auto; position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.32); background: rgba(255,255,255,.07); touch-action: none; display: grid; place-items: center; transition: background .15s, transform .1s; }
.pad-btn.down { background: rgba(255,255,255,.22); transform: scale(.95); }
.pad-btn span { font-size: 12px; letter-spacing: .08em; color: rgba(255,255,255,.8); text-shadow: 0 1px 6px rgba(0,0,0,.35); transition: opacity 1.2s; }
body.quiet .pad-btn span { opacity: 0; }
#btnJump { right: 0; bottom: 0; width: 88px; height: 88px; }
#btnTrick { right: 100px; bottom: 26px; width: 66px; height: 66px; }
#btnPause { position: fixed; z-index: 4; right: calc(14px + var(--sar)); top: calc(12px + var(--sat)); width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06); opacity: .55; display: none; }
body.playing #btnPause { display: block; }
#btnPause::before, #btnPause::after { content: ""; position: absolute; top: 12px; width: 3px; height: 12px; border-radius: 2px; background: rgba(255,255,255,.8); }
#btnPause::before { left: 14px; } #btnPause::after { right: 14px; }

/* words */
body.touch 
/* title */
.overlay { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; text-align: center; padding: 24px; }
#title { cursor: pointer; background: radial-gradient(ellipse 52% 40% at 50% 50%, rgba(14,26,36,.42), rgba(14,26,36,0) 100%), radial-gradient(ellipse at 50% 60%, rgba(14,26,36,.0), rgba(14,26,36,.35)); }
#title h1 { margin: 0; font-family: var(--f-title); font-weight: 300; font-size: clamp(54px, 11vw, 120px); letter-spacing: .02em; line-height: 1; text-shadow: 0 2px 30px rgba(0,0,0,.3); }
#title p { margin: 14px 0 0; font-family: var(--f-title); font-weight: 300; font-size: clamp(16px, 2.6vw, 21px); opacity: .9; text-shadow: 0 1px 14px rgba(0,0,0,.4); }
#title .go { margin-top: 38px; font-family: var(--f-ui); font-size: 13px; letter-spacing: .22em; text-transform: uppercase; opacity: .9; text-shadow: 0 1px 10px rgba(0,0,0,.6); animation: breathe 3.2s ease-in-out infinite; }
#title .small { margin-top: 10px; font-size: 12px; letter-spacing: .1em; opacity: .75; font-family: var(--f-ui); text-shadow: 0 1px 8px rgba(0,0,0,.6); }
@keyframes breathe { 50% { opacity: .35 } }
#loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #b0cce0; font-family: var(--f-title); font-weight: 300; font-size: 20px; color: #24323e; letter-spacing: .06em; }

/* pause */
#pause { z-index: 8; background: rgba(14,20,30,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.card { width: min(360px, 88vw); padding: 26px 26px 22px; border-radius: 18px; background: rgba(246,241,231,.94); color: var(--ink); text-align: left; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.card h2 { margin: 0 0 16px; font-family: var(--f-title); font-weight: 500; font-size: 30px; }
.card label { display: grid; grid-template-columns: 7.5em 1fr; align-items: center; gap: 10px; margin: 12px 0; font-size: 14px; }
.card input[type=range] { width: 100%; accent-color: #3f6f8a; }
.card .row { display: flex; gap: 10px; margin-top: 18px; }
.card button { flex: 1; padding: 11px 14px; border-radius: 12px; border: 1.5px solid #1b1a24; background: transparent; font-size: 14px; }
.card button.main { background: #1b1a24; color: var(--paper); }
.card small { display: block; margin-top: 14px; font-size: 12px; line-height: 1.5; opacity: .65; }
.card .where { margin: -8px 0 10px; font-family: var(--f-title); font-size: 17px; opacity: .8; }
.card .howto { margin: 14px 0 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.55; }
.card .howto li { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; }
.card .howto b { font-weight: 500; opacity: .7; }
#pause { overflow-y: auto; }
#map { display: block; width: min(100%, 34vh); aspect-ratio: 1; margin: 4px auto 6px; border-radius: 12px; background: #e8dfcc; }
/* landscape phones: map on the left, the rest of the menu beside it */
@media (orientation: landscape) and (max-height: 560px) {
  #pause .card { width: min(720px, 94vw); display: grid; grid-template-columns: auto 1fr; column-gap: 20px; grid-auto-flow: row dense; align-content: start; padding: 16px 20px; max-height: 94vh; overflow-y: auto; }
  #pause .card > *:not(#map) { grid-column: 2; }
  #pause .card h2 { margin-bottom: 6px; font-size: 24px; }
  #pause #map { grid-column: 1; grid-row: 1 / span 9; width: min(80vh, 42vw); margin: 0; align-self: start; }
}

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
"use strict";
// ============================================================
//  CORE — utils, renderer, toon materials, outlines, textures
// ============================================================
const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  smooth: t => t * t * (3 - 2 * t),
  ease: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  damp: (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt)),
  angDamp(a, b, k, dt) { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * (1 - Math.exp(-k * dt)); },
  wrapAng(a) { return ((a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; },
  rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; },
  isTouch: ('ontouchstart' in window) || navigator.maxTouchPoints > 0,
};
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

const FONT = {
  display: '"Dela Gothic One", "Arial Black", Impact, sans-serif',
  body: '"M PLUS Rounded 1c", "Trebuchet MS", system-ui, sans-serif',
  dot: '"DotGothic16", "Courier New", monospace'
};

const G = {};
function initRenderer() {
  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  G.dprMax = Math.min(window.devicePixelRatio || 1, U.isTouch ? 1.75 : 2);
  G.dpr = G.dprMax;
  renderer.setPixelRatio(G.dpr);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0xff9d6b);
  G.renderer = renderer;
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xffa27a, 70, 330);
  G.scene = scene;
  const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 1400);
  G.camera = camera;
  scene.add(camera);

  // lights — low sunset sun from the west
  const hemi = new THREE.HemisphereLight(0xffe7d6, 0x6b4fa0, 0.62); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffd7a8, 0.78); sun.position.set(-60, 45, 30); scene.add(sun);
  G.sun = sun; G.hemi = hemi;

  // toon ramp
  const ramp = new Uint8Array([90, 90, 110, 255, 175, 165, 185, 255, 255, 255, 255, 255]);
  const grad = new THREE.DataTexture(ramp, 3, 1, THREE.RGBAFormat);
  grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.generateMipmaps = false; grad.needsUpdate = true;
  G.grad = grad;
  G.outlineMat = new THREE.MeshBasicMaterial({ color: 0x14101f, side: THREE.BackSide, fog: true });
  G.lineMat = new THREE.LineBasicMaterial({ color: 0x14101f, fog: true, transparent: true, opacity: 0.85 });
  G.toonCache = {};
  window.addEventListener('resize', onResize);
  onResize();
}
function onResize() {
  if (!G.renderer) return;
  const w = window.innerWidth, h = window.innerHeight;
  G.renderer.setSize(w, h, false);
  G.camera.aspect = w / h;
  G.camera.fov = w < h ? 80 : 66;
  G.camera.updateProjectionMatrix();
}
function toon(color, opts = {}) {
  const { noCache, ...rest } = opts || {};
  const key = color + JSON.stringify(rest);
  if (!noCache && G.toonCache[key]) return G.toonCache[key];
  const m = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: G.grad }, rest));
  if (!noCache) G.toonCache[key] = m;
  return m;
}
function basic(color, opts = {}) { return new THREE.MeshBasicMaterial(Object.assign({ color }, opts)); }

// inverted-hull outline: a back-faced, slightly inflated copy behind the mesh
function outline(mesh, t = 0.04) {
  const g = mesh.geometry;
  if (!g.boundingBox) g.computeBoundingBox();
  const bb = g.boundingBox, size = bb.getSize(V3()), c = bb.getCenter(V3());
  const s = V3(size.x > 1e-4 ? (size.x + 2 * t) / size.x : 1, size.y > 1e-4 ? (size.y + 2 * t) / size.y : 1, size.z > 1e-4 ? (size.z + 2 * t) / size.z : 1);
  const o = new THREE.Mesh(g, G.outlineMat);
  o.scale.copy(s);
  o.position.set(c.x * (1 - s.x), c.y * (1 - s.y), c.z * (1 - s.z));
  o.raycast = () => {};
  mesh.add(o);
  return mesh;
}
// convenience: toon mesh + outline
function part(geo, color, t = 0.04, opts) {
  const m = new THREE.Mesh(geo, typeof color === 'object' ? color : toon(color, opts));
  if (t > 0) outline(m, t);
  return m;
}

// ---------- static geometry merger ----------
// Everything static is merged into a few big meshes per material, split into
// spatial chunks so the camera can skip what it can't see.
const CHUNK = 48;
class StaticBatch {
  constructor() { this.buckets = {}; this.lines = {}; }
  bucket(name, x, z) {
    const key = name + '|' + Math.floor(x / CHUNK) + ',' + Math.floor(z / CHUNK);
    return this.buckets[key] || (this.buckets[key] = { name, pos: [], nor: [], col: [], uv: [] });
  }
  // kind: 'building' (windows on sides, roof on top), 'plain', 'roofonly' and any material name
  add(geo, matrix, color, kind = 'plain', { outlineT = 0.12, edges = true, uvScale = 8, roofColor = null } = {}) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (matrix) g.applyMatrix4(matrix);
    if (!g.attributes.normal) g.computeVertexNormals();
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    const col = new THREE.Color(color), rcol = new THREE.Color(roofColor || color);
    for (let i = 0; i < p.length; i += 9) {
      const ny = (n[i + 1] + n[i + 4] + n[i + 7]) / 3, nx = (n[i] + n[i + 3] + n[i + 6]) / 3, nz = (n[i + 2] + n[i + 5] + n[i + 8]) / 3;
      let bn = kind;
      if (kind === 'building') bn = Math.abs(ny) > 0.5 ? 'roof' : 'wall';
      else if (this.split && this.split[kind]) bn = Math.abs(ny) > 0.5 ? this.split[kind][0] : this.split[kind][1];
      else if (kind === 'roofonly') bn = 'roof';
      else if (kind === 'metal') bn = 'plain';
      const cx = (p[i] + p[i + 3] + p[i + 6]) / 3, cz = (p[i + 2] + p[i + 5] + p[i + 8]) / 3;
      const b = this.bucket(bn, cx, cz);
      const shade = ny < -0.5 ? 0.55 : 1;
      const cc = bn === 'roof' && roofColor ? rcol : col;
      for (let k = 0; k < 3; k++) {
        const j = i + k * 3;
        b.pos.push(p[j], p[j + 1], p[j + 2]);
        b.nor.push(n[j], n[j + 1], n[j + 2]);
        b.col.push(cc.r * shade, cc.g * shade, cc.b * shade);
        let u, v;
        const ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz);
        if (ay >= ax && ay >= az) { u = p[j]; v = p[j + 2]; }
        else if (ax >= az) { u = p[j + 2] * Math.sign(nx || 1); v = p[j + 1]; }
        else { u = -p[j] * Math.sign(nz || 1); v = p[j + 1]; }
        b.uv.push(u / uvScale, v / uvScale);
      }
    }
    if (outlineT > 0) {
      g.computeBoundingBox();
      const bb = g.boundingBox, size = bb.getSize(V3()), c = bb.getCenter(V3());
      const og = g.clone();
      const sx = size.x > 1e-4 ? (size.x + 2 * outlineT) / size.x : 1, sy = size.y > 1e-4 ? (size.y + 2 * outlineT) / size.y : 1, sz = size.z > 1e-4 ? (size.z + 2 * outlineT) / size.z : 1;
      og.applyMatrix4(new THREE.Matrix4().makeTranslation(c.x, c.y, c.z).multiply(new THREE.Matrix4().makeScale(sx, sy, sz)).multiply(new THREE.Matrix4().makeTranslation(-c.x, -c.y, -c.z)));
      this.addOutline(og);
    }
    if (edges) {
      const eg = new THREE.EdgesGeometry(geo, 30); if (matrix) eg.applyMatrix4(matrix);
      const a = eg.attributes.position.array;
      for (let i = 0; i < a.length; i += 6) {
        const key = Math.floor((a[i] + a[i + 3]) / 2 / CHUNK) + ',' + Math.floor((a[i + 2] + a[i + 5]) / 2 / CHUNK);
        const L = this.lines[key] || (this.lines[key] = []);
        for (let k = 0; k < 6; k++) L.push(a[i + k]);
      }
    }
  }
  // back-faced hull geometry already shaped as an outline (e.g. a fatter tube)
  addOutline(geo) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    const op = g.attributes.position.array;
    for (let i = 0; i < op.length; i += 9) {
      const b = this.bucket('outline', (op[i] + op[i + 3] + op[i + 6]) / 3, (op[i + 2] + op[i + 5] + op[i + 8]) / 3);
      for (let k = 0; k < 9; k++) b.pos.push(op[i + k]);
    }
  }
  box(x0, y0, z0, x1, y1, z1, color, kind = 'plain', opts) {
    const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
    const m = new THREE.Matrix4().makeTranslation((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    this.add(geo, m, color, kind, opts);
  }
  build(materials) {
    const group = new THREE.Group();
    for (const key in this.buckets) {
      const b = this.buckets[key], name = b.name;
      if (!b.pos.length) continue;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
      if (name === 'outline') { group.add(new THREE.Mesh(g, G.outlineMat)); continue; }
      g.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
      const mesh = new THREE.Mesh(g, materials[name] || materials.plain);
      if (name === 'water' || name === 'glow') mesh.renderOrder = 3;
      group.add(mesh);
    }
    for (const key in this.lines) {
      const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(this.lines[key], 3));
      group.add(new THREE.LineSegments(lg, G.lineMat));
    }
    return group;
  }
}

// tube along a polyline, with parallel-transport frames (rails, pipes, cables)
function tubeGeo(pts, r, radial = 6) {
  const n = pts.length, pos = [], nor = [], idx = [];
  const T = [], N = [], Bn = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    T.push(V3().subVectors(b, a).normalize());
  }
  let nn = Math.abs(T[0].y) < 0.9 ? V3(0, 1, 0) : V3(1, 0, 0);
  nn = V3().crossVectors(T[0], nn).normalize();
  for (let i = 0; i < n; i++) {
    if (i > 0) { const bb = V3().crossVectors(T[i - 1], T[i]); if (bb.length() > 1e-6) { bb.normalize(); const ang = Math.acos(U.clamp(T[i - 1].dot(T[i]), -1, 1)); nn.applyAxisAngle(bb, ang); } }
    N.push(nn.clone()); Bn.push(V3().crossVectors(T[i], nn).normalize());
  }
  for (let i = 0; i < n; i++) for (let k = 0; k <= radial; k++) {
    const a = k / radial * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const nx = N[i].x * c + Bn[i].x * s, ny = N[i].y * c + Bn[i].y * s, nz = N[i].z * c + Bn[i].z * s;
    pos.push(pts[i].x + nx * r, pts[i].y + ny * r, pts[i].z + nz * r); nor.push(nx, ny, nz);
  }
  for (let i = 0; i < n - 1; i++) for (let k = 0; k < radial; k++) {
    const a = i * (radial + 1) + k, b = a + radial + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

// ---------- canvas textures ----------
function canvasTex(w, h, draw, { repeat = false, nearest = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  if (repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; }
  if (nearest) { tex.magFilter = THREE.NearestFilter; }
  tex.anisotropy = 4;
  const o = { c, x, tex, draw, redraw(...a) { draw(x, w, h, ...a); tex.needsUpdate = true; } };
  o.redraw();
  return o;
}

const PAL = {
  ink: '#14101f', yellow: '#ffd23f', magenta: '#ff2e88', cyan: '#19d3ff', mint: '#8ff0c8', mintDark: '#2e9b7a',
  pink: '#ffb3d1', orange: '#ff7a2f', violet: '#6a3df0', lime: '#c6ff3d', cream: '#fff6e8'
};

function faceTextures(skin, style) {

      else if (kind === 'closed') { x.beginPath(); x.moveTo(cx - 9, eyeY + 2); x.lineTo(cx + 9, eyeY + 2); x.stroke(); }
      else if (kind === 'wide') { x.fillStyle = '#fff'; x.beginPath(); x.ellipse(cx, eyeY, 10, 13, 0, 0, 7); x.fill(); x.stroke(); x.fillStyle = PAL.ink; x.beginPath(); x.arc(cx, eyeY + 1, 4, 0, 7); x.fill(); }
      else if (kind === 'smug') { x.beginPath(); x.ellipse(cx, eyeY + 2, 7, 9, 0, 0, 7); x.fill(); x.lineWidth = 5; x.beginPath(); x.moveTo(cx - 12, eyeY - 4); x.lineTo(cx + 12, eyeY - 6); x.stroke(); x.lineWidth = 6; }

    };
    const e = { neutral: 'dot', talk: 'dot', grin: 'happy', mega: 'happy', shock: 'wide', smug: 'smug', worried: 'dot', blink: 'closed' }[mood] || 'dot';
    eye(64 - ex, e); eye(64 + ex, e);
    if (mood === 'worried') { x.lineWidth = 4; x.beginPath(); x.moveTo(64 - ex - 10, eyeY - 18); x.lineTo(64 - ex + 8, eyeY - 22); x.moveTo(64 + ex + 10, eyeY - 18); x.lineTo(64 + ex - 8, eyeY - 22); x.stroke(); x.lineWidth = 6; }

      x.strokeStyle = '#8ff0c8'; x.lineWidth = 3; x.beginPath(); x.moveTo(44, 90); x.quadraticCurveTo(64, 93, 84, 90); x.stroke();

    } else if (mood === 'grin' || mood === 'mega') {

    else if (mood === 'shock') { x.fillStyle = '#7a1f3d'; x.beginPath(); x.ellipse(64, 90, 7, 11, 0, 0, 7); x.fill(); x.stroke(); }
    else if (mood === 'smug') { x.beginPath(); x.moveTo(52, 86); x.quadraticCurveTo(66, 92, 78, 80); x.stroke(); }
    else if (mood === 'worried') { x.beginPath(); x.moveTo(52, 90); x.quadraticCurveTo(58, 84, 64, 89); x.quadraticCurveTo(70, 94, 76, 88); x.stroke(); }

function crtFaces() {
  const draw = (mood) => canvasTex(128, 96, (x, w, h) => {
    x.fillStyle = '#0e2a3a'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 380; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }

    const eyes = { neutral: 'sq', talk: 'sq', grin: 'up', mega: 'up', shock: 'big', smug: 'flat', worried: 'tilt', blink: 'flat' }[mood] || 'sq';
    for (const cx of [38, 90]) {
      if (eyes === 'sq') x.fillRect(cx - p, 28, p * 2, p * 2);
      else if (eyes === 'big') x.fillRect(cx - p * 1.4, 22, p * 2.8, p * 2.8);
      else if (eyes === 'flat') x.fillRect(cx - p, 36, p * 2, p * 0.7);
      else if (eyes === 'up') { x.fillRect(cx - p, 36, p * 0.7, p * 0.7); x.fillRect(cx - p * 0.35, 30, p * 0.7, p * 0.7); x.fillRect(cx + p * 0.3, 36, p * 0.7, p * 0.7); }

    else if (mood === 'talk') x.fillRect(46, 58, 36, 16);
    else if (mood === 'shock') x.fillRect(54, 56, 20, 22);
    else if (mood === 'worried') { x.fillRect(40, 66, 14, 6); x.fillRect(52, 62, 24, 6); x.fillRect(74, 66, 14, 6); }

    for (let y = 0; y < h; y += 4) { x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(0, y, w, 2); }
  }, { nearest: true });
  const out = {}; for (const m of ['neutral', 'talk', 'grin', 'mega', 'shock', 'smug', 'worried', 'blink']) out[m] = draw(m).tex; return out;
}

      aR: [-sw * 0.9 * amp + 0.1, 0, -0.25 - amp * 0.1, 0.4 + amp * 0.3],
      head: [-0.1 * amp, 0, -sw * 0.05 * amp]

  W.waters.push({ x0: R[0] - 20, z0: QZ, x1: R[2] + 40, z1: QZ + 400, y: 0, deep: true, harbour: true });
  // warehouses
  const wcols = ['#a0522d', '#3a6a6a', '#8a4a3a', '#7a7a7a', '#5a6a4a', '#b8864a'];
  const sheds = [[480, 420, 600, 470], [640, 420, 780, 470], [830, 420, 1020, 470], [480, 520, 560, 640], [880, 520, 1020, 600], [480, 700, 560, 820]];

    // sawtooth roof: a row of ramps you can run up and drop off
    const n = Math.max(2, Math.round((x1 - x0) / 12)), step = (x1 - x0) / n;
    for (let k = 0; k < n; k++) K.ramp(x0 + k * step, z0, x0 + (k + 1) * step, z1, 'x', bb.top, bb.top + 3.2, '#c9c2b4', false, bb.top - 0.2, 'roof');
    H.reserve([x0, z0, x1, z1]);

  const ccols = ['#c4523a', '#2f5f8a', '#e8b84a', '#3e8f86', '#8a5a9e', '#d97a3a', '#f2efe6', '#4a7a3a'];

  F.box(sx0, -2, sz0, sx1, sy, sz1, '#2f3f5a'); F.box(sx1 - 40, sy, sz0 + 3, sx1 - 12, sy + 14, sz1 - 3, '#f2efe6');
  const gx = 760, gy0 = terrainAt(gx, QZ - 6);

  K.rail([[sx0 + 1, sy + 1.1, sz1 - 0.5], [sx1 - 1, sy + 1.1, sz1 - 0.5]], { color: '#e9e4f5', postMax: 1.2 });
  K.rail([[sx0 + 1, sy + 1.1, sz0 + 0.5], [gx - 3, sy + 1.1, sz0 + 0.5]], { color: '#e9e4f5', postMax: 1.2 });
  K.rail([[gx + 3, sy + 1.1, sz0 + 0.5], [sx1 - 1, sy + 1.1, sz0 + 0.5]], { color: '#e9e4f5', postMax: 1.2 });
  K.rail([[sx0 + 0.5, sy + 1.1, sz0 + 1], [sx0 + 0.5, sy + 1.1, sz1 - 1]], { color: '#e9e4f5', postMax: 1.2 });

  // harbour cranes along the quay (tall frames), the gantry over the yard

// ============================================================
//  LAKESHORE — promenade under plane trees, the beach, the marina,
//  a long pier with a lighthouse at the end (hidden spot)
// ============================================================
function buildLakeshore(H) {
  const { K, W, B, F, S } = H, r = U.rng(808);
  const R = PLAN.byKey.lake.rect;
  // the promenade, following the shore
  const prom = []; for (let x = R[0] + 4; x <= R[2] + 160; x += 24) prom.push([x, shoreZ(x) - 34]);
  groundRibbon(B, prom, 10, '#d8cbb0', 'walk', 0.08); H.line(prom, 5);
  for (let i = 0; i < prom.length; i++) {
    const [x, z] = prom[i];
    if (i % 2 === 0 && H.clearOf(x - 1, z - 12, x + 1, z - 8, 0)) H.tree(x, z - 10, { s: 1.25, h: 4.5, color: '#5f8f45', color2: '#6f9a50', squash: 0.75 });
    if (i % 2 === 1) { if (H.clearOf(x - 2, z + 5, x + 2, z + 6, 0)) H.bench(x, z + 5.6, true, { view: true }); }
    if (i % 3 === 0 && H.clearOf(x - 0.3, z - 6.3, x + 0.3, z - 5.7, 0)) H.lamp(x + 6, z - 6, { style: 'globe', h: 4, color: '#1f2a3a' });
  }
  H.walkers([prom], 50, 'lake');
  H.busker('pan', prom[20][0] + 7, prom[20][1] - 5, 0);
  // the pier and the lighthouse
  const px = -480, pz0 = shoreZ(px) - 12, pz1 = 1585, py = 2.7;
  S.add(px, terrainAt(px, pz0) + 0.05, pz0, px, py, pz0 + 14, 2.6);
  S.add(px, py, pz0 + 14, px, py, pz1 - 8, 2.6);
  for (let z = pz0; z < pz1 - 8; z += 4) {
    const y = z < pz0 + 14 ? U.lerp(terrainAt(px, pz0) + 0.05, py, (z - pz0) / 14) : py;
    B.add(new THREE.BoxGeometry(5.4, 0.3, 4.05), new THREE.Matrix4().makeRotationX(z < pz0 + 14 ? -Math.atan2(py - terrainAt(px, pz0), 14) : 0).setPosition(px, y - 0.15, z + 2), '#9a7a58', 'wood', { outlineT: 0.03, edges: false });
    if (z % 12 === 0) for (const sd of [-1, 1]) K.cyl(px + sd * 2.5, -4, z, 0.22, y + 4, '#5a4430', { outline: 0.02, seg: 6 });
    if (z % 8 === 0) H.sound(px, y, z, 2.4, 'plank');
  }
  for (const sd of [-1, 1]) K.rail([[px + sd * 2.5, py + 1, pz0 + 16], [px + sd * 2.5, py + 1, pz1 - 10]], { color: '#e9e4f5', postColor: '#5a4430', postMax: 1.2 });

  { key: 'upper', at: [850, -1290], walls: ['#d8d4c8', '#c8c4b8', '#e4e0d4', '#b8b4a8', '#cfc8b8'], roofs: ['#5a6272', '#6a6a7a', '#4a5260'], trim: '#4a4a52', types: ['stone', 'steep', 'tower', 'stone', 'gable', 'steep'] },

function roofY(c, x, z) {

// ---------- house kinds ----------
// a gabled roof's ridge: a pale cap of tiles you can grind from end to end
function roofRidge(H, c, stepCol) {

// half-timbering: dark beams on the upper floors

// a flat roof to sit out on: a low parapet all round (its top grinds), and something up there

// one old-town house. o: { q (quarter), front (the side the lane is on), type, top, col, rc, rise, slopeX, shop }
function oldHouse(H, x0, z0, x1, z1, r, o = {}) {
  const { K, W, B } = H, Q = o.q || oldQ((x0 + x1) / 2, (z0 + z1) / 2), w = x1 - x0, d = z1 - z0;

  const col = o.col || pick(r, Q.walls), rc = o.rc || pick(r, Q.roofs);

  const flat = type === 'terrace' || type === 'tower';

  const c = { x0, z0, x1, z1, top: bb.top, lo: bb.lo, hi: bb.hi, rise: 0, flat, type, col, rc };
  if (flat) roofTerrace(H, c, r, { wall: type === 'tower' ? col : '#efe6d4', tower: type === 'tower', flag: Q.roofs[0] });
  else {

    if (type === 'timber') timbers(H, c);

    const fr = faceFrame(o.front, x0, z0, x1, z1), [gl, gh] = frGround(fr, 0.6);

      const u = (r() - 0.5) * (fr.L - 3), b = frBox(fr, u - 0.55, u + 0.55, 0, 0.09), s = frBox(fr, u - 0.8, u + 0.8, 0, 0.7);
      B.box(b[0], gl, b[1], b[2], gh + 2.1, b[3], pick(r, ['#5a3a2a', '#2f5f6a', '#3e6f4a', '#7a2f2f', '#2f4f7a', '#3a3550']), 'plain', { outlineT: 0.03, edges: false });
      B.box(s[0], gl - 0.3, s[1], s[2], gh + 0.12, s[3], '#b9b0a0', 'paving', { outlineT: 0.03, edges: false });

// a row of houses wall to wall (their ridges line up into one long run). `c` is the front line, `dir` the side the houses stand on
function terraceRow(H, alongX, a0, a1, c, dir, r, o = {}) {
  const out = []; let a = a0;
  while (a < a1 - 5.5) {
    let w = 6.5 + r() * 4.5; if (a + w > a1 - 5.5) w = a1 - a; if (w > 12) w /= 2;
    const d = 8 + r() * 3.5;
    const [x0, z0, x1, z1] = alongX ? [a, dir > 0 ? c : c - d, a + w, dir > 0 ? c + d : c] : [dir > 0 ? c : c - d, a, dir > 0 ? c + d : c, a + w];
    if (H.clearOf(x0 + 0.05, z0 + 0.05, x1 - 0.05, z1 - 0.05, o.pad ?? 0)) out.push(oldHouse(H, x0, z0, x1, z1, r, Object.assign({ slopeX: !alongX, front: alongX ? (dir > 0 ? 'n' : 's') : (dir > 0 ? 'w' : 'e') }, o)));

// ---------- fronts ----------
// a shop: a window, a canvas shade over it (it bounces), sometimes a sign. Some shops' shades are set out as steps up the wall.

      const y = stall(x, z, pick(r, SHADES), kind, 2.75 + ((k + ri) % 3) * 0.55); vendors.push([x, z + 1.8, Math.PI, y]);
      H.reserve([x - 2.4, z - 1.4, x + 2.4, z + 1.4]);
    }
  });
  // strings of lanterns over the aisles (grinds)
  for (const x of [652, 752, 852]) for (const [za, zb] of [[-127, -86], [-4, 47]]) {
    if (!H.clearOf(x - 0.4, za - 0.4, x + 0.4, za + 0.4, 0.1) || !H.clearOf(x - 0.4, zb - 0.4, x + 0.4, zb + 0.4, 0.1)) continue;
    const y0 = terrainAt(x, za), y1 = terrainAt(x, zb);
    K.cyl(x, y0 - 0.2, za, 0.1, 6.7, '#4a3a2a', { outline: 0.02, seg: 5 }); K.cyl(x, y1 - 0.2, zb, 0.1, 6.7, '#4a3a2a', { outline: 0.02, seg: 5 });
    K.rail([[x, y0 + 6.3, za], [x, y1 + 6.3, zb]], { kind: 'cable', lanterns: true, posts: false, sag: 0.6 });
  }
  // inns and the dyers' yard claim their ground before the rows of shops
  for (const [x0, z0, x1, z1, name, band] of MKT.inns) if (H.clearPts(x0, z0, x1, z1, 2)) buildInn(H, x0, z0, x1, z1, r, name, band, roofs);
  if (H.clearPts(...MKT.dyers, 2)) buildDyers(H, ...MKT.dyers, r);
  // rows of flat-roofed shops along every lane
  const shopCols = ['#f4ecd8', '#efe0c0', '#e8c890', '#d9a066', '#f6f1e7', '#e0b070', '#d08a5a', '#f0d8a8', '#e8d0b0'];
  const mrow = (z, side, off, o = {}) => {
    const built = []; let x = R[0] + 10;
    while (x < R[2] - 10) {

      if (crossX.some(c => x < c + 5 && x + w > c - 5)) { x += 2; continue; }

    const N = z === 50 ? [] : mrow(z, -1, off, { covered }), Sd = z === -130 ? [] : mrow(z, 1, off, { covered });
    if (!covered) continue;
    // the covered lanes: beams from wall to wall carrying canvas (it bounces) and slatted screens (you can walk on those); lanterns under
    const cov = (L, p) => L.some(([a, b]) => p >= a && p <= b); let run = null;
    for (let x = R[0] + 12, k = 0; x < R[2] - 16; x += 6, k++) {
      const ok = cov(N, x + 0.3) && cov(N, x + 5.7) && cov(Sd, x + 0.3) && cov(Sd, x + 5.7) && !crossX.some(c => Math.abs(x + 3 - c) < 8);

      put(H.SH.BOX, x, y - 0.18, z, 0.3, 0.3, off * 2, '#5a4030', 'wood', 0.03);
      if (m === 2) K.box(x + 0.2, y - 0.04, z - off + 0.05, x + 5.8, y + 0.12, z + off - 0.05, '#a07a4a', 'wood', { outlineT: 0.04 });
      else if (m !== 4) {

        B.box(x + 0.3, y, z - off + 0.05, x + 5.7, y + 0.1, z + off - 0.05, c, 'plain', { outlineT: 0.03, edges: false });
        B.box(x + 2.4, y + 0.1, z - off + 0.05, x + 3.6, y + 0.12, z + off - 0.05, '#f6f1e7', 'plain', { outlineT: 0, edges: false });
        W.boxes.push({ x0: x + 0.3, y0: y - 0.35, z0: z - off + 0.05, x1: x + 5.7, y1: y + 0.1, z1: z + off - 0.05, tag: 'bounce' });
      }
      if (k % 2 === 0) { K.sphere(x, y - 0.75, z, 0.3, ['#ffd27a', '#ff9a6a', '#ffe9b0'][k % 3], { kind: 'glow', outline: 0.03, seg: 8, sy: 1.25 }); W.lamps.push([x, y - 0.7, z]); if (k % 4 === 0) H.pool(x, z, 5, '#ffc870'); }
      if (run && Math.abs(run[4] - (y - 0.1)) < 1.5) run[2] = x + 6; else (W.indoor = W.indoor || []).push(run = [x, z - off, x + 6, z + off, y - 0.1]);
    }
  }

  // roof level

  const alleys = lanesZ.map(z => [[MX0, z], [MX1, z]]).concat([[[604, -88], [896, -88]], [[604, -2], [896, -2]], [[604, -114], [896, -114]], [[604, 10], [896, 10]]]);

  H.standers(vendors, 'market');
  H.busker('oud', 650, -45, 1.57);
  H.walkers(alleys, 90, 'market');

}

// a flat-roofed market house. o: { list, front, covered (its front opens onto a covered lane), top, bare }
function flatHouse(H, x0, z0, x1, z1, h, col, r, o = {}) {
  const { K, W, B } = H, put = H.put;
  const bb = H.bldg(x0, z0, x1, z1, h, col, { trim: false, outline: 0.12, kind: 'house', top: o.top, roof: '#e0d4b8' });
  const c = { x0, z0, x1, z1, top: bb.top, lo: bb.lo, hi: bb.hi, rise: 0, flat: true, type: 'flat', noWay: o.bare };
  roofTerrace(H, c, r, { wall: '#f6f1e7', mkt: true, bare: o.bare, ph: o.ph, dome: !o.bare && r() < 0.14 ? pick(r, ['#f6f1e7', '#2f6f9d', '#3e8f86', '#e8c890']) : null });
  if (o.front) {
    const fr = faceFrame(o.front, x0, z0, x1, z1), [gl, gh] = frGround(fr, 0.6), hw = fr.L / 2 - 0.8;
    // a band of colour along the foot of the wall
    const bd = frBox(fr, -fr.L / 2, fr.L / 2, 0, 0.06); B.box(bd[0], gl - 0.5, bd[1], bd[2], gh + 0.5, bd[3], pick(r, ['#2f6f9d', '#c4523a', '#3e8f86', '#e8b84a', '#8a5a9e']), 'plain', { outlineT: 0, edges: false });
    if (o.covered) {
      // an open shop: a dark opening, goods set out in front and hung on the wall
      const b = frBox(fr, -hw, hw, 0, 0.12); B.box(b[0], gh + 0.1, b[1], b[2], gh + 3.0, b[3], '#3a2a22', 'plain', { outlineT: 0, edges: false });
      const what = Math.floor(r() * 4);
      for (let k = 0, n = Math.max(2, Math.floor(hw)); k < n; k++) {
        const u = U.lerp(-hw + 0.5, hw - 0.5, (k + 0.5) / n), [px, pz] = frPt(fr, u, 0.75), c2 = pick(r, SHADES);
        if (what === 0) { const q = frBox(fr, u - 0.45, u + 0.45, 0.13, 0.19); B.box(q[0], gh + 0.9, q[1], q[2], gh + 2.9, q[3], c2, 'plain', { outlineT: 0.02, edges: false }); }      // carpets
        else if (what === 1) { put(H.SH.CYL, px, gh + 0.3, pz, 0.32, 0.6, 0.32, '#b8643f', 'plain', 0.03); put(H.SH.CONE, px, gh + 0.78, pz, 0.28, 0.4, 0.28, pick(r, ['#c8501e', '#e8a020', '#d8c040', '#8a3a1e']), 'plain', 0); }   // sacks of spice
        else if (what === 2) { put(H.SH.ICO, px, gh + 0.32, pz, 0.36, 0.36, 0.36, pick(r, ['#b8643f', '#2f6f9d', '#f6f1e7', '#3e8f86']), 'flat', 0.03); }                           // pots
        else { const [lx, lz] = frPt(fr, u, 0.5); put(H.SH.CYL, lx, gh + 2.75, lz, 0.015, 0.5, 0.015, '#2a2838', 'plain', 0); K.sphere(lx, gh + 2.35, lz, 0.2, pick(r, ['#ffd27a', '#ff9a6a', '#7fd3ff', '#ff7ab0']), { kind: 'glow', outline: 0.02, seg: 6, sy: 1.2 }); }   // lamps
      }
      if (r() < 0.5) { const [px, pz] = frPt(fr, (r() - 0.5) * hw, 1.3); H.standers([[px, pz, frYaw(fr), terrainAt(px, pz)]], 'market'); }
    } else shopFront(H, fr, gh, r, c, { steps: 0.22 });
    if (!o.covered && bb.top - gh > 8.6 && r() < 0.5) gallery(H, fr, gh + 6.2, r, { rail: '#2f6f9d', floor: '#f6f1e7' });
  }
  H.reserve([x0, z0, x1, z1]);
  if (o.list) o.list.push(c);
  return c;
}

// a courtyard inn: a square of rooms round a yard, a gallery on posts all round inside, gateways north and south
function buildInn(H, x0, z0, x1, z1, r, name, band, roofs) {
  const { K, W, B } = H, put = H.put, t = 9, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, wall = '#f4ecd8', gw = 2.8;

  const wing = (a0, c0, a1, c1) => flatHouse(H, a0, c0, a1, c1, 0, wall, r, { list: roofs, top, bare: true, ph: 0.3 });
  for (const [c0, c1] of [[z0, z0 + t], [z1 - t, z1]]) {
    wing(x0, c0, cx - gw, c1); wing(cx + gw, c0, x1, c1);
    K.box(cx - gw, hi + 4.6, c0, cx + gw, top, c1, wall, 'house', { outlineT: 0.1 });

    B.box(cx - gw - 0.3, hi + 4.6, c0 - 0.12, cx + gw + 0.3, hi + 5.1, c1 + 0.12, band, 'plain', { outlineT: 0.03, edges: false });
  }
  wing(x0, z0 + t, x0 + t, z1 - t); wing(x1 - t, z0 + t, x1, z1 - t);
  for (const f of ['n', 's', 'w', 'e']) { const fr = faceFrame(f, x0, z0, x1, z1), b = frBox(fr, -fr.L / 2, fr.L / 2, 0, 0.07); B.box(b[0], lo - 1, b[1], b[2], hi + 1.1, b[3], band, 'plain', { outlineT: 0, edges: false }); if (f === 'n' || f === 's') wallSign(H, name, fr, 0, hi + 6.2, 8, 1.2, band, '#fff6e0'); }
  // the yard
  const Y = [x0 + t, z0 + t, x1 - t, z1 - t], gd = 2.2, I = [Y[0] + gd, Y[1] + gd, Y[2] - gd, Y[3] - gd];
  H.patch(Y, '#e0cfa8', 'tiles', 0.07);
  for (const [a0, c0, a1, c1] of [[Y[0], Y[1], Y[2], I[1]], [Y[0], I[3], Y[2], Y[3]], [Y[0], I[1], I[0], I[3]], [I[2], I[1], Y[2], I[3]]]) K.box(a0, gy - 0.18, c0, a1, gy, c1, '#e6dfd2', 'plain', { outlineT: 0.04 });
  for (let x = I[0]; x <= I[2] + 0.1; x += (I[2] - I[0]) / 4) for (const z of [I[1], I[3]]) put(H.SH.CYL, x, (terrainAt(x, z) + gy) / 2 - 0.2, z, 0.16, gy - terrainAt(x, z) + 0.2, 0.16, band, 'plain', 0.03);
  for (let z = I[1] + (I[3] - I[1]) / 3; z < I[3] - 1; z += (I[3] - I[1]) / 3) for (const x of [I[0], I[2]]) put(H.SH.CYL, x, (terrainAt(x, z) + gy) / 2 - 0.2, z, 0.16, gy - terrainAt(x, z) + 0.2, 0.16, band, 'plain', 0.03);
  // stairs: from the yard to the gallery (west side), from the gallery to the roof (east side); the railing leaves room for the first

  K.ramp(I[0] + 0.1, I[1] + 0.2, I[0] + 1.8, I[3], 'z', g0, gy, '#c9a878', true, 0, 'wood');
  K.rail([[I[0] + 2.0, gy + 0.95, I[3]], [I[2], gy + 0.95, I[3]], [I[2], gy + 0.95, I[1]], [I[0], gy + 0.95, I[1]], [I[0], gy + 0.95, I[3]]], { color: band, radius: 0.06, round: 0, postMax: 1.3, voice: 'balcony' });
  K.rail([[I[0] + 1.85, g0 + 0.95, I[1] + 0.2], [I[0] + 1.85, gy + 0.95, I[3]]], { color: band, radius: 0.06, round: 0, postMax: 6 });
  K.ramp(I[2] + 0.3, I[1], Y[2] - 0.2, I[3], 'z', top, gy, '#c9a878', true, 0, 'wood');

// the record shop: a sunken yard with crates of records and string lights (hidden spot)
function buildRecordShop(H, r) {

function fillRoutes(H) {
  const { K, W } = H;

  // it ends in a turning circle round a little tree island

    for (const [k, rd] of roads) for (const end of (k === 'oblique' ? [] : [rd.pts[0], rd.pts[rd.pts.length - 1]])) {

  const side = (pts, off, h) => { const out = []; for (let i = 0; i < pts.length - 1; i++) { const [ax, az] = pts[i], [bx, bz] = pts[i + 1], L = Math.hypot(bx - ax, bz - az), ux = (bx - ax) / L, uz = (bz - az) / L; for (let t = 0; t < L; t += 3) { const x = ax + ux * t - uz * off, z = az + uz * t + ux * off; out.push([x, terrainAt(x, z) + h, z]); } } return out; };

}

// ============================================================
//  the cable car: from the lakeshore lawn up over the canals and the forest to a clearing near the top
//  of the ridge. The gondolas never stop (jump onto a roof from a station platform); the cables are
//  long, sagging grinds — ride one all the way down to the lake.
// ============================================================
const CABLE = { A: [-880, 1050], B: [-575, -1285], spans: 10, lift: 34, off: 3.6, hang: 3.4, speed: 7, gap: 150 };
function buildCable(H) {
  const { K, W, B, F } = H, C = CABLE;
  const [ax, az] = C.A, [bx, bz] = C.B, L = Math.hypot(bx - ax, bz - az), ux = (bx - ax) / L, uz = (bz - az) / L, nx = -uz, nz = ux;
  // keep the corridor clear of houses and trees
  H.line([C.A, C.B], 9);
  // tower positions (ends are the stations, lower so the gondolas come within reach)
  const towers = [];
  for (let i = 0; i <= C.spans; i++) {
    const t = i / C.spans, x = ax + (bx - ax) * t, z = az + (bz - az) * t, g = terrainAt(x, z);
    const end = i === 0 || i === C.spans;
    towers.push({ x, z, g, y: g + (end ? 4.3 : C.lift), end });
  }
  const line = (sd) => towers.map(T => [T.x + nx * C.off * sd, T.y, T.z + nz * C.off * sd]);
  const dipK = 0.45;
  // the grindable cables (the rail system draws them and adds the sag)
  for (const sd of [-1, 1]) K.rail(line(sd), { kind: 'cable', sag: dipK, posts: false, radius: 0.07, color: '#2a2838' });
  // towers: tapered steel legs, a cross-arm at the top with sheaves
  for (const T of towers) {
    if (T.end) continue;
    const h = T.y - T.g + 0.6, yaw = Math.atan2(ux, uz);
    B.add(new THREE.CylinderGeometry(0.9, 2.4, h, 4), new THREE.Matrix4().makeRotationY(Math.PI / 4 + yaw).setPosition(T.x, T.g + h / 2 - 0.3, T.z), '#9aa0b4', 'plain', { outlineT: 0.08, edges: false });
    B.add(new THREE.BoxGeometry(C.off * 2 + 2.4, 0.9, 1.2), new THREE.Matrix4().makeRotationY(yaw).setPosition(T.x, T.y + 0.5, T.z), '#c4523a', 'plain', { outlineT: 0.06, edges: false });
    for (const sd of [-1, 1]) K.cyl(T.x + nx * C.off * sd, T.y + 0.05, T.z + nz * C.off * sd, 0.55, 0.3, '#2a2838', { outline: 0.02, seg: 10 });
    W.boxes.push({ x0: T.x - 1.4, y0: T.g - 1, z0: T.z - 1.4, x1: T.x + 1.4, y1: T.y - 1, z1: T.z + 1.4, tag: 'tower' });
    F.add(new THREE.CylinderGeometry(0.8, 2.2, h, 4), new THREE.Matrix4().makeTranslation(T.x, T.g + h / 2, T.z), '#9aa0b4');
    H.reserve([T.x - 4, T.z - 4, T.x + 4, T.z + 4]);
  }
  // stations: a platform you can reach from a ramp, a roof over the wheel house
  for (const [k, T] of [[0, towers[0]], [1, towers[C.spans]]]) {
    const dir = k === 0 ? 1 : -1, cx = T.x - ux * dir * 6, cz = T.z - uz * dir * 6, py = T.g + 1.6;
    const yaw = Math.atan2(ux, uz), hw = C.off + 3.2;
    H.blob(cx, cz, 18, 18, '#d8cbb0', 'tiles', 0.08, 11);
    for (const sd of [-1, 1]) {
      // a platform under each line, beside the gondola path
      const px = cx + nx * (C.off + 2.6) * sd, pz = cz + nz * (C.off + 2.6) * sd;
      K.box(px - 2.2, T.g - 0.3, pz - 2.2, px + 2.2, py, pz + 2.2, '#c4523a', 'plain', { outlineT: 0.05 });
      K.ramp(px - 2.2, pz + 2.2, px + 2.2, pz + 7, 'z', py, T.g, '#c4523a', false, T.g - 0.3);
    }
    // the wheel house roof, high over the turnaround
    const rx = T.x + ux * dir * 2, rz = T.z + uz * dir * 2;
    for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) K.cyl(rx + nx * hw * sx + ux * 4 * sz, T.g - 0.2, rz + nz * hw * sx + uz * 4 * sz, 0.3, T.y + 2.6 - T.g, '#e9e4f5', { outline: 0.03, seg: 6 });
    B.add(new THREE.BoxGeometry(hw * 2 + 1, 0.6, 10), new THREE.Matrix4().makeRotationY(yaw).setPosition(rx, T.y + 2.8, rz), '#3e8f86', 'plain', { outlineT: 0.06, edges: false });
    // the bull wheel the cable turns round, hung from a column under the roof, and the frame that holds it
    K.cyl(T.x, T.y - 0.25, T.z, C.off + 0.25, 0.5, '#2a2838', { outline: 0.03, seg: 20 });
    K.cyl(T.x, T.y - 0.1, T.z, C.off - 0.6, 0.35, '#c4523a', { outline: 0.02, seg: 20 });
    K.cyl(T.x, T.y + 0.25, T.z, 0.45, 2.3, '#9aa0b4', { outline: 0.03, seg: 8 });
    B.add(new THREE.BoxGeometry(1.2, T.y - T.g + 0.6, 1.2), new THREE.Matrix4().makeRotationY(yaw).setPosition(T.x + ux * dir * 2.4, (T.y + T.g) / 2 - 0.2, T.z + uz * dir * 2.4), '#9aa0b4', 'plain', { outlineT: 0.06, edges: false });
    B.add(new THREE.BoxGeometry(0.8, 0.8, 3.2), new THREE.Matrix4().makeRotationY(yaw).setPosition(T.x + ux * dir * 1.2, T.y + 0.3, T.z + uz * dir * 1.2), '#9aa0b4', 'plain', { outlineT: 0.06, edges: false });
    W.boxes.push({ x0: T.x + ux * dir * 2.4 - 0.7, y0: T.g - 1, z0: T.z + uz * dir * 2.4 - 0.7, x1: T.x + ux * dir * 2.4 + 0.7, y1: T.y - 0.6, z1: T.z + uz * dir * 2.4 + 0.7, tag: 'tower' });
    H.reserve([cx - 18, cz - 18, cx + 18, cz + 18]);
    H.standers([[cx + nx * 9, cz + nz * 9, yaw, T.g], [cx - nx * 9 + ux * 3, cz - nz * 9 + uz * 3, yaw + 2, T.g]], k === 0 ? 'lake' : 'park');
    H.bench(cx - ux * dir * 10, cz - uz * dir * 10, Math.abs(nx) > Math.abs(nz), { view: true });
  }
  // the cable's shape, for the gondolas: piecewise segments with the same sag the rail uses
  const segs = []; let s0 = 0;
  for (let i = 0; i < towers.length - 1; i++) { const a = towers[i], b = towers[i + 1], l = Math.hypot(b.x - a.x, b.z - a.z, b.y - a.y); segs.push({ a, b, l, s0, dip: dipK * l / 20 }); s0 += l; }
  const turn = Math.PI * C.off;
  W.cable = { segs, len: s0, turn, loop: 2 * s0 + 2 * turn, ux, uz, nx, nz, off: C.off, speed: C.speed, n: Math.floor((2 * s0 + 2 * turn) / C.gap), A: towers[0], B: towers[towers.length - 1] };
}
// where a gondola is on its loop: up the +side line, round the top wheel, down the -side line, round the bottom
function cableAt(cb, s, out) {
  s = ((s % cb.loop) + cb.loop) % cb.loop;
  let u, sd;
  if (s < cb.len) { u = s; sd = 1; out.dir = 1; }
  else if (s < cb.len + cb.turn) {
    const a = (s - cb.len) / cb.turn * Math.PI, T = cb.B;     // round the top: from +side through the far end to -side
    out.x = T.x + cb.nx * cb.off * Math.cos(a) + cb.ux * cb.off * Math.sin(a); out.z = T.z + cb.nz * cb.off * Math.cos(a) + cb.uz * cb.off * Math.sin(a);
    out.y = T.y; out.dir = 0; out.yaw = Math.atan2(cb.ux, cb.uz) + a; return out;
  } else if (s < 2 * cb.len + cb.turn) { u = 2 * cb.len + cb.turn - s; sd = -1; out.dir = -1; }
  else {
    const a = (s - 2 * cb.len - cb.turn) / cb.turn * Math.PI, T = cb.A;
    out.x = T.x - cb.nx * cb.off * Math.cos(a) - cb.ux * cb.off * Math.sin(a); out.z = T.z - cb.nz * cb.off * Math.cos(a) - cb.uz * cb.off * Math.sin(a);
    out.y = T.y; out.dir = 0; out.yaw = Math.atan2(cb.ux, cb.uz) + Math.PI + a; return out;
  }
  let g = cb.segs[cb.segs.length - 1]; for (const q of cb.segs) if (u <= q.s0 + q.l) { g = q; break; }
  const t = U.clamp((u - g.s0) / g.l, 0, 1);
  out.x = U.lerp(g.a.x, g.b.x, t) + cb.nx * cb.off * sd; out.z = U.lerp(g.a.z, g.b.z, t) + cb.nz * cb.off * sd;
  out.y = U.lerp(g.a.y, g.b.y, t) - 4 * g.dip * t * (1 - t);
  out.yaw = Math.atan2(cb.ux * sd, cb.uz * sd);
  return out;
}

    else H.put(H.SH.ICO, x, y + 0.35, z, 1.0 + r() * 0.6, 0.55 + r() * 0.2, 1.0 + r() * 0.6, pick(r, ['#3f6a35', '#4a7a3e', '#557f3a']), 'flat', 0.05, r() * 6);
  }
  // in among the trees
  for (let i = 0; i < 1400; i++) {
    const x = PR[0] + 10 + r() * (PR[2] - PR[0] - 20), z = PR[1] + 10 + r() * (PR[3] - PR[1] - 20);

// giant instruments on the lawn: a xylophone to skate across, chime tubes under a beam you grind,

// Lavaux on the observatory's south slope: dry-stone terrace walls along the contours (long level
// grinds), rows of vines between, a winemaker's house with a tower, people at work
function vineyards(H, r) {
  const { K, W, B } = H;
  const x0 = 280, x1 = 415, z0 = -1290, z1 = -1105;
  let z = z0;
  while (z < z1) {
    const gap = 9 + r() * 5, a0 = x0 + r() * 14, a1 = x1 - r() * 14, ph = r() * 6, amp = 1.5 + r() * 2.5;

    let ok = true; for (const [px, pz] of pts) if (!H.clearOf(px - 3.5, pz - 1, px + 3.5, pz + 1, 0)) { ok = false; break; }
    if (ok) {

          }

// the city's sky: a soft gradient, a sun with a glow, and clouds drifting on a high plane

  const c3 = (h) => new THREE.Color(h);

    side: THREE.BackSide, depthWrite: false, fog: false,

    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,

  }

    Game.swim = 1.6; Sound.sfx.splash(1.3); Sound.sfx.bubbles();
    Game.fx.burst(V3(pos.x, deep.y + 0.1, pos.z), 24, ['#bfe9ff', '#ffffff'], 6, 0.8, 10); $('fade').classList.add('on');

    const sp = p.speed; if (sp > 8) { p.vel.x *= 8 / sp; p.vel.z *= 8 / sp; }
    if (sp > 1 && Math.random() < 0.6) Game.fx.emit(_wv2.set(pos.x, wet.y + 0.05, pos.z), _wv.set((Math.random() - 0.5) * 3, 2 + Math.random() * 2, (Math.random() - 0.5) * 3), '#d8f0ff', 0.5, 12);

const _wv = V3(), _wv2 = V3();

// ---------- sitting and listening ----------
function updateListening(dt) {
  const p = Game.player, W = Game.W, moving = Math.hypot(Input.move.x, Input.move.y) > 0.15 || Input.kbActive || Input.jumpQ.length || Input.trickQ.length;
  if (Game.sit) {
    if (moving) { Game.sit = null; p.pos.y += 0.05; }
  } else if (p.mode === 'ground' && p.speed < 0.4 && !moving) {
    Game.still += dt;
    if (Game.still > 1.2) {
      let best = null, bd = 2.2; for (const b of W.benches) { const d = Math.hypot(b.x - p.pos.x, b.z - p.pos.z); if (d < bd && Math.abs(b.y - p.pos.y) < 1.2) { bd = d; best = b; } }
      if (best) {
        Game.sit = best;
        // face away from the bench, towards the view (downhill, or the lake)
        const ax = best.alongX ? 0 : 1, az = best.alongX ? 1 : 0;
        const down = terrainAt(best.x + ax * 6, best.z + az * 6) < terrainAt(best.x - ax * 6, best.z - az * 6) ? 1 : -1;
        p.yaw = Math.atan2(ax * down, az * down); const h = best.half ? -best.half : 0; p.pos.set(best.x + (best.alongX ? h : 0), best.y, best.z + (best.alongX ? 0 : h));

  } else Game.still = 0;
  const target = Game.sit ? 1 : U.clamp((Game.still - 3.5) / 3, 0, 1);
  Game.listen = U.damp(Game.listen, target, Game.listen < target ? 0.6 : 3, dt);
  // the camera drifts back and up to take in the view
  const cam = Game.cam;
  cam.dist = 7 + Game.listen * 13;
  cam.basePitch = 0.33 + Game.listen * 0.12;
  if (Game.listen > 0.2) cam.yaw += dt * 0.035 * Game.listen;
}

// ---------- main loop ----------
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - Game.last) / 1000; Game.last = now;
  if (dt > 0.1) dt = 0.1; if (dt <= 0) dt = 0.001;
  Game.t += dt;
  const W = Game.W, p = Game.player;
  const bi = Sound.beat();
  if (Game.state === 'play') {
    Game.hazardCD = Math.max(0, Game.hazardCD - dt);
    Input.poll();
    const moving = Math.hypot(Input.move.x, Input.move.y) > 0.15 || Input.kbActive || Input.jumpQ.length > 0;
    // safety net: nobody falls out of the world
    Game.cam.indoor = (W.indoor || []).some(r => p.pos.x > r[0] && p.pos.x < r[2] && p.pos.z > r[1] && p.pos.z < r[3] && p.pos.y < r[4]) || p.pos.y < terrainAt(p.pos.x, p.pos.z) - 3.5 && !!(W.metro && W.metro.pts.some((q, i) => i % 4 === 0 && Math.abs(q.x - p.pos.x) < 60 && Math.abs(q.z - p.pos.z) < 60 && q.y < p.pos.y + 3 && (q.bored)));
    if (p.pos.y < -40 || p.pos.y < terrainAt(p.pos.x, p.pos.z) - 70 || !isFinite(p.pos.y)) { getUp(); Game.cam.snap(p); }
    if (Game.swim > 0) {
      Game.swim -= dt; Input.flush(); p.vel.multiplyScalar(0.9);
      if (Game.swim <= 0.6 && !Game.swimDone) { Game.swimDone = true; p.respawn(false); Game.cam.snap(p); }
      if (Game.swim <= 0) { Game.swimDone = false; $('fade').classList.remove('on'); }
    } else if (Game.down > 0) {
      Game.down -= dt; Input.flush();
      p.update(dt, Game.cam.yaw, now);
      if (Game.down <= 0) getUp();
    } else {
      if (Game.waitResume && moving) { Game.waitResume = false; Sound.resume(); }
      p.update(dt, Game.cam.yaw, now);
      // trains
      const T = W.trainsys.hits(p.pos);
      if (T && Game.hazardCD <= 0) { Game.hitByTrain = true; const b = T.boxes[0]; knockDown({ vx: b.vx, vz: b.vz }); }
      // cars and boats
      const v = Life.hits(p.pos); if (v && Game.hazardCD <= 0) knockDown(v);
    }
    updateListening(dt);
    if (Game.sit) { p.vel.set(0, 0, 0); p.pos.set(Game.sit.x, Game.sit.y, Game.sit.z); }
    Game.cam.update(dt, p);
    if (Game.sit) { Game.rig.root.position.set(Game.sit.x, Game.sit.y + 0.12, Game.sit.z); Game.rig.root.rotation.y = p.yaw; Game.rig.update(dt, Game.rig.poseTarget('sit'), { rock: 0.02 }); }
    else p.syncRig(dt, bi.phase);

    districtWeights(p.pos.x, p.pos.z, _dw, 140);
    if (Game.radio && Game.radioK > 0.02) { const k = Game.radioK * 0.75; for (const key in _dw) _dw[key] *= 1 - k; _dw[Game.radio] = (_dw[Game.radio] || 0) + k; }
    Sound.setPlace(_dw, dt); Sky.S.weights = _dw;
    const ground = p.ground;
    // a run of tricks and grinds lasts until you've been back on the ground for a moment
    Game.groundT = p.mode === 'ground' ? (Game.groundT || 0) + dt : 0;
    if (Game.groundT > 0.9) Game.combo = 0;
    Sound.update(dt, { alt: p.pos.y - terrainAt(p.pos.x, p.pos.z), combo: Game.combo || 0, grindH: p.mode === 'grind' ? p.pos.y - terrainAt(p.pos.x, p.pos.z) : 0, zone: zoneAt(p.pos.x, p.pos.z), dawn: Math.max(0, 1 - Math.abs(Sky.phase - 0.27) / 0.07), speed: p.speed, grinding: p.mode === 'grind', air: p.mode === 'air' && p.airTime > 0.25, airTime: p.airTime, grounded: p.mode === 'ground', listen: Game.listen, night: Sky.night, train: ground && ground.train ? 1 : 0, under: (W.metro && p.ground && p.ground.slab && isCovered(p.pos)) ? 1 : 0, water: Game.swim > 0 ? 1 : 0, spots: Game.spots || {}, crowd: Life.crowdNear });
    updateHints(dt);
  } else if (Game.state === 'title') {
    // a slow flight over the city
    // a slow glide high above the old town and the observatory, looking down the slope to the lake
    const a = Game.t * 0.025;
    G.camera.position.set(Math.sin(a) * 520 + 120, 230 + Math.sin(Game.t * 0.1) * 8, -1250 + Math.cos(a * 0.7) * 120);
    G.camera.lookAt(Math.sin(a) * 200, 20, 700);
  }
  if (Game.state !== 'paused') {
    for (const d of W.dyn) d.update(dt, bi);
    Life.update(dt, bi, Game.state === 'play' ? p.pos : G.camera.position); Fauna.update(dt, bi, Game.state === 'play' ? p.pos : G.camera.position);
    if (Game.state === 'play') { updateWorld(dt, bi); updateGrindHint(dt, bi); }
    Game.fx.update(dt);
    Sky.update(dt, G.camera.position);
  }
  Game.cellT = (Game.cellT || 0) - dt;
  if (Game.cellT <= 0) { Game.cellT = 0.25; W.updateCells(G.camera.position.x, G.camera.position.z, Game.cellR || 360); }
  if (!Game.noRender) G.renderer.render(G.scene, G.camera);
  // adaptive resolution
  Game.dprAcc += dt; Game.dprN++;
  if (Game.dprN >= 90) {
    const avg = Game.dprAcc / Game.dprN; Game.dprAcc = 0; Game.dprN = 0;
    // quality steps: sharpness first down to 1x, then how far the detailed city reaches, then a little blur
    const Q = [[G.dprMax, 360], [Math.min(G.dprMax, 1.25), 340], [1, 320], [1, 280], [1, 250], [0.85, 230]];
    Game.q = Game.q ?? 0;
    const q0 = Game.q;
    if (avg > 0.026 && Game.q < Q.length - 1) Game.q++;
    else if (avg < 0.0145 && Game.q > 0) Game.q--;
    if (Game.q !== q0) { const [d, R] = Q[Game.q]; Game.cellR = R; if (d !== G.dpr) { G.dpr = d; G.renderer.setPixelRatio(G.dpr); onResize(); } }
  }
}
function isCovered(pos) { const M = Game.W.metro; for (let i = 0; i < M.N; i += 4) { const q = M.pts[i]; if (q.covered && Math.hypot(q.x - pos.x, q.z - pos.z) < 8) return true; } return false; }

function start() { boot().catch(e => { console.error(e); const l = $('loading'); l.hidden = false; l.textContent = 'Something broke while building the city: ' + e.message; }); }
start();

// debug helper for tests: render a region from straight above
window.debugTopDown = (x0, z0, x1, z1, px = 1600) => {
  const cam = new THREE.OrthographicCamera(x0, x1, -z0, -z1, 1, 4000);
  cam.position.set(0, 1500, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0);
  for (const g of Game.W.cells.values()) g.visible = true;
  const fog = G.scene.fog; G.scene.fog = null;
  const w = px, h = Math.round(px * (z1 - z0) / (x1 - x0));

  return url;
};

<script>
// ============================================================
//  DEBUG PAGE (city_debug.html only) — jump straight to every place
//  with something to see or hear, set the time of day, watch the music
// ============================================================
(() => {
  const css = `#dbg{position:fixed;left:8px;top:8px;bottom:8px;width:230px;z-index:20;overflow:auto;background:rgba(246,241,231,.93);border-radius:12px;padding:8px 10px;font:12px/1.35 system-ui,sans-serif;color:#1b1a24;box-shadow:0 8px 30px rgba(0,0,0,.25)}

#dbg button:hover{background:#ffe9b0}#dbg .row{display:flex;gap:4px}#dbg .row button{text-align:center}
#dbg pre{margin:6px 0 0;white-space:pre-wrap;font:11px/1.35 ui-monospace,monospace}
#dbg.min{width:auto;bottom:auto}#dbg.min>*:not(.top){display:none}`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  const box = document.createElement('div'); box.id = 'dbg'; document.body.appendChild(box);

  // stand the player at (x, z), facing (fx, fz) if given, on whatever ground is there
  function go(x, z, fx, fz, y) {
    if (Game.state === 'title') document.getElementById('title').dispatchEvent(new PointerEvent('pointerdown'));
    const W = Game.W, p = Game.player;
    const gy = y != null ? y : W.groundAt(x, z, (y ?? terrainAt(x, z)) + 40).y;
    p.pos.set(x, gy + 0.05, z); p.vel.set(0, 0, 0); p.mode = 'ground';
    if (fx != null) p.yaw = Math.atan2(fx - x, fz - z);

  }
  const near = (x, z, d = 14) => {      // a free spot a little way off, looking at (x, z)
    for (let r = d; r < d + 40; r += 4) for (let a = 0; a < 16; a++) {
      const xx = x + Math.cos(a / 16 * 6.283) * r, zz = z + Math.sin(a / 16 * 6.283) * r, t = terrainAt(xx, zz);

    }

  function build() {
    const W = Game.W, groups = [];
    const add = (g, name, fn) => { let G = groups.find(e => e[0] === g); if (!G) groups.push(G = [g, []]); G[1].push([name, fn]); };
    for (const d of PLAN.districts) { const [a, b, c, e] = d.rect; add('Districts', d.name, () => look((a + c) / 2, (b + e) / 2, 6)); }
    for (const s of (W.stations || [])) add('Metro', s.name + (s.under ? ' (underground)' : ''), () => go(s.p.x - s.p.dz * s.platOff, s.p.z + s.p.dx * s.platOff, s.p.x, s.p.z, s.platY));

    if (W.metro) add('Metro', 'In the ridge tunnel', () => { const M = W.metro, i = M.pts.findIndex(q => q.bored && q.x < -300), p = M.pts[(Math.max(0, i) + 25) % M.N]; go(p.x - p.dz * 4.6, p.z + p.dx * 4.6, null, null, p.y + 0.4); });
    for (const s of PLAN.spots) add('Landmarks', s.key, () => look(s.at[0], s.at[1], 22));
    const seen = new Set();
    for (const s of (W.spots || [])) { const k = s.key; if (seen.has(k) && !k.startsWith('busk')) continue; seen.add(k); add(s.busker ? 'Buskers' : 'Music spots', k.replace('busk_', ''), () => look(s.x, s.z, Math.min(10, (s.r || 10) * 0.5))); }
    if (W.ferris) add('Rides', 'Ferris wheel', () => look(W.ferris.x, W.ferris.z, 24));

    add('New places', 'Forest crag — foot of the path', () => go(CRAG_LINK[2][0], CRAG_LINK[2][1], CRAG.spine[1][0], CRAG.spine[1][1]));
    add('New places', 'Forest crag — summit', () => { const s = cragAt(0.97), e = cragZip().end; go(s[0], s[1], e[0], e[1]); });
    add('New places', 'Building site — gate', () => go(SITE[2] + 6, (SITE[1] + SITE[3]) / 2 + 14, SITE[0], (SITE[1] + SITE[3]) / 2));
    add('New places', 'Building site — crane jib', () => go(SITE[0] + 60, SITE[1] + 23, SITE[0], SITE[1] + 23, SITE.y + 27.3));
    add('New places', 'Tower — lift door', () => go(TOWER.x, TOWER.z + 24, TOWER.x, TOWER.z));
    add('New places', 'Tower — sky deck', () => go(TOWER.x + 8, TOWER.z + 12, TOWER.x + 30, TOWER.z - 4, TOWER.deckY));
    add('New places', 'Sunken street', () => go(VALLEY.x, -560, VALLEY.x, -480));
    add('New places', 'Bridge over the sunken street', () => go(VALLEY.x - 40, -492, VALLEY.x, -492));
    add('New places', 'Vineyards', () => go(345, -1180, 345, -1260));

    add('Old town', 'On a roof', () => { const L = (W.roofsOld || []).filter(q => q.flat && q.type !== 'tower'), c = L[Math.floor(Math.random() * L.length)]; if (c) go((c.x0 + c.x1) / 2, (c.z0 + c.z1) / 2, c.x1 + 20, c.z1 + 20, c.top + 0.1); });
    add('Market', 'Great market (by the tower)', () => go(MKT.tower[0] - 14, MKT.tower[1] + 14, MKT.tower[0], MKT.tower[1]));
    add('Market', 'Covered lane', () => go(760, -250, 800, -250));
    MKT.inns.forEach(n => add('Market', n[4], () => go((n[0] + n[2]) / 2, n[1] - 8, (n[0] + n[2]) / 2, n[3])));
    add('Market', "Dyers' yard", () => go((MKT.dyers[0] + MKT.dyers[2]) / 2, MKT.dyers[1] - 8, (MKT.dyers[0] + MKT.dyers[2]) / 2, MKT.dyers[3]));
    for (const way of ['stair', 'shades']) add('Market', 'Way up: ' + way, () => { const L = (W.roofsMkt || []).filter(q => q.way === way), c = L[Math.floor(Math.random() * L.length)]; if (c) { const dx = c.wayAt[0] - (c.x0 + c.x1) / 2, dz = c.wayAt[1] - (c.z0 + c.z1) / 2, l = Math.hypot(dx, dz) || 1; go(c.wayAt[0] + dx / l * 6, c.wayAt[1] + dz / l * 6, c.wayAt[0], c.wayAt[1]); } });
    add('Market', 'On the roofs', () => { const L = W.roofsMkt || [], c = L[Math.floor(Math.random() * L.length)]; if (c) go((c.x0 + c.x1) / 2, (c.z0 + c.z1) / 2, c.x1 + 20, c.z1 + 20, c.top + 0.1); });
    add('Places', 'Music garden', () => look(-500, 905, 12));
    add('Places', 'Canal basin', () => look(PLAN.canal.bendX, canalEndZ() - 10, 18));
    add('Places', 'Skatepark', () => look(-545, 256, 16));
    add('Places', 'Beach huts', () => look(-800, shoreZ(-800) - 24, 16));
    add('Places', 'Pond', () => look(PLAN.pond.x, PLAN.pond.z, PLAN.pond.r + 8));
    const F = typeof Fauna !== 'undefined' ? Fauna : null;
    if (F) {
      add('Animals', 'Deer', () => { const d = F.deer && F.deer[0]; if (d) look(d.x, d.z, 16); });
      add('Animals', 'Rabbits', () => { const d = F.rabbits && F.rabbits[0]; if (d) look(d.x, d.z, 8); });
      add('Animals', 'Heron', () => { const d = F.heron; if (d) look(d.x, d.z, 10); });

    }

    if (W.oldLanes && W.oldLanes[0]) add('Scenes', 'Tour group lane', () => { const q = W.oldLanes[0][0]; look(q[0], q[1], 6); });

    box.innerHTML = `<div class="top row"><button id="dbgMin">Debug ▾</button></div>
      <h4>Time</h4><div class="row">${[['dawn', 0.255], ['noon', 0.45], ['dusk', 0.7], ['night', 0.92]].map(([n, v]) => `<button data-t="${v}">${n}</button>`).join('')}</div>
      <pre id="dbgInfo"></pre>` + groups.map(([g, list], gi) => `<h4>${g}</h4>` + list.map(([n], i) => `<button data-g="${gi}" data-i="${i}">${n}</button>`).join('')).join('');
    box.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;

      if (b.dataset.g) groups[+b.dataset.g][1][+b.dataset.i][1]();

      const p = Game.player, el = document.getElementById('dbgInfo'); if (!el || !p) return;
      el.textContent = `x ${p.pos.x.toFixed(0)}  z ${p.pos.z.toFixed(0)}  y ${p.pos.y.toFixed(1)}\n${Sound.place || '-'} · ${Sound.modeName || ''} · ${Math.round(Sound.bpm || 0)} bpm\ntime ${Sky.phase.toFixed(2)} · ${p.mode}`;
    }, 300);

})();
