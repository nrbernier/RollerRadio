<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
/* Nothing on screen but the city: faint rings for the thumbs, a few words at the start. */
:root {
  --ink: #1b1a24; --paper: #f6f1e7; --soft: rgba(246,241,231,.55);
  --f-title: "Fraunces", Georgia, serif;
  --f-ui: "M PLUS Rounded 1c", "Trebuchet MS", system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: #b0cce0; color: var(--paper); font-family: var(--f-ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
html, body, canvas, #touch { touch-action: none; }
button, input { touch-action: manipulation; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
#touch { position: fixed; inset: 0; z-index: 2; }
#fade { position: fixed; inset: 0; z-index: 9; pointer-events: none; background: #0e1a24; opacity: 0; transition: opacity .6s ease; }
#fade.on { opacity: 1; }

/* thumbs: a faint ring for the stick, two faint circles for the buttons */
#stickbase { position: fixed; left: 0; top: 0; width: 128px; height: 128px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.04); z-index: 3; pointer-events: none; display: none; transition: opacity .8s; }
body.touch.playing #stickbase { display: block; left: calc(30px + var(--sal)); top: auto; bottom: calc(30px + var(--sab)); opacity: .5; }
body.touch.playing #stickbase.live { left: 0; top: 0; bottom: auto; opacity: .8; transition: none; }
#knob { position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.22); border: 1.5px solid rgba(255,255,255,.35); }
#buttons { position: fixed; right: calc(16px + var(--sar)); bottom: calc(18px + var(--sab)); width: 190px; height: 170px; z-index: 3; display: none; pointer-events: none; }
body.touch.playing #buttons { display: block; }
.pad-btn { pointer-events: auto; position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.32); background: rgba(255,255,255,.07); touch-action: none; display: grid; place-items: center; transition: background .15s, transform .1s; }
.pad-btn.down { background: rgba(255,255,255,.22); transform: scale(.95); }
.pad-btn span { font-size: 12px; letter-spacing: .08em; color: rgba(255,255,255,.8); text-shadow: 0 1px 6px rgba(0,0,0,.35); transition: opacity 1.2s; }
body.quiet .pad-btn span { opacity: 0; }
#btnJump { right: 0; bottom: 0; width: 88px; height: 88px; }
#btnTrick { right: 100px; bottom: 26px; width: 66px; height: 66px; }
#btnPause { position: fixed; z-index: 4; right: calc(14px + var(--sar)); top: calc(12px + var(--sat)); width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06); opacity: .55; display: none; }
body.playing #btnPause { display: block; }
#btnPause::before, #btnPause::after { content: ""; position: absolute; top: 12px; width: 3px; height: 12px; border-radius: 2px; background: rgba(255,255,255,.8); }
#btnPause::before { left: 14px; } #btnPause::after { right: 14px; }

/* words */
#hint { position: fixed; z-index: 5; left: 50%; bottom: calc(26px + var(--sab)); transform: translate(-50%, 10px); opacity: 0; transition: opacity 1.1s, transform 1.1s; max-width: min(460px, 70vw); text-align: center; font-family: var(--f-title); font-weight: 300; font-size: clamp(16px, 2.3vw, 20px); line-height: 1.45; color: var(--paper); text-shadow: 0 1px 14px rgba(0,0,0,.45), 0 0 2px rgba(0,0,0,.3); pointer-events: none; }
#hint.show { opacity: 1; transform: translate(-50%, 0); }
body.touch #hint { bottom: calc(190px + var(--sab)); }
#place { position: fixed; z-index: 5; left: calc(22px + var(--sal)); top: calc(18px + var(--sat)); font-family: var(--f-title); font-weight: 300; font-size: 15px; letter-spacing: .14em; text-transform: lowercase; color: var(--paper); text-shadow: 0 1px 10px rgba(0,0,0,.4); opacity: 0; transition: opacity 2s; pointer-events: none; }
#place.show { opacity: .85; }

/* title */
.overlay { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; text-align: center; padding: 24px; }
#title { cursor: pointer; background: radial-gradient(ellipse at 50% 60%, rgba(14,26,36,.0), rgba(14,26,36,.35)); }
#title h1 { margin: 0; font-family: var(--f-title); font-weight: 300; font-size: clamp(54px, 11vw, 120px); letter-spacing: .02em; line-height: 1; text-shadow: 0 2px 30px rgba(0,0,0,.3); }
#title p { margin: 14px 0 0; font-family: var(--f-title); font-weight: 300; font-size: clamp(16px, 2.6vw, 21px); opacity: .9; text-shadow: 0 1px 14px rgba(0,0,0,.4); }
#title .go { margin-top: 38px; font-family: var(--f-ui); font-size: 13px; letter-spacing: .22em; text-transform: uppercase; opacity: .8; animation: breathe 3.2s ease-in-out infinite; }
#title .small { margin-top: 10px; font-size: 12px; letter-spacing: .1em; opacity: .6; font-family: var(--f-ui); }
@keyframes breathe { 50% { opacity: .35 } }
#loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #b0cce0; font-family: var(--f-title); font-weight: 300; font-size: 20px; color: #24323e; letter-spacing: .06em; }

/* pause */
#pause { z-index: 8; background: rgba(14,20,30,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.card { width: min(360px, 88vw); padding: 26px 26px 22px; border-radius: 18px; background: rgba(246,241,231,.94); color: var(--ink); text-align: left; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.card h2 { margin: 0 0 16px; font-family: var(--f-title); font-weight: 500; font-size: 30px; }
.card label { display: grid; grid-template-columns: 7.5em 1fr; align-items: center; gap: 10px; margin: 12px 0; font-size: 14px; }
.card input[type=range] { width: 100%; accent-color: #3f6f8a; }
.card .row { display: flex; gap: 10px; margin-top: 18px; }
.card button { flex: 1; padding: 11px 14px; border-radius: 12px; border: 1.5px solid #1b1a24; background: transparent; font-size: 14px; }
.card button.main { background: #1b1a24; color: var(--paper); }
.card small { display: block; margin-top: 14px; font-size: 12px; line-height: 1.5; opacity: .65; }
</style>
<div id="loading">building the city…</div>

  <button class="pad-btn" id="btnTrick" aria-label="Trick"><span>trick</span></button>

  <div>
    <h1>Rubato</h1>

    <div class="go">tap to wander</div>
    <div class="small">headphones on</div>
  </div>
</div>
<div id="pause" class="overlay" hidden>
  <div class="card">
    <h2>Resting</h2>
    <label>Music <input id="volMusic" type="range" min="0" max="100" value="85"></label>
    <label>Sounds <input id="volFx" type="range" min="0" max="100" value="80"></label>
    <label>Time of day <input id="tod" type="range" min="0" max="100" value="60"></label>
    <div class="row"><button class="main" id="btnResume">Carry on</button></div>
    <small>Skate anywhere. Stand still on a bench to listen. Nothing to win, nothing to collect.</small>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
"use strict";
// ============================================================
//  CORE — utils, renderer, toon materials, outlines, textures
// ============================================================
const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  smooth: t => t * t * (3 - 2 * t),
  ease: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  damp: (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt)),
  angDamp(a, b, k, dt) { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * (1 - Math.exp(-k * dt)); },
  wrapAng(a) { return ((a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; },
  rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; },
  isTouch: ('ontouchstart' in window) || navigator.maxTouchPoints > 0,
};
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

const FONT = {
  display: '"Dela Gothic One", "Arial Black", Impact, sans-serif',
  body: '"M PLUS Rounded 1c", "Trebuchet MS", system-ui, sans-serif',
  dot: '"DotGothic16", "Courier New", monospace'
};

const G = {};
function initRenderer() {
  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  G.dprMax = Math.min(window.devicePixelRatio || 1, U.isTouch ? 1.75 : 2);
  G.dpr = G.dprMax;
  renderer.setPixelRatio(G.dpr);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0xff9d6b);
  G.renderer = renderer;
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xffa27a, 70, 330);
  G.scene = scene;
  const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 1400);
  G.camera = camera;
  scene.add(camera);

  // lights — low sunset sun from the west
  const hemi = new THREE.HemisphereLight(0xffe7d6, 0x6b4fa0, 0.62); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffd7a8, 0.78); sun.position.set(-60, 45, 30); scene.add(sun);
  G.sun = sun; G.hemi = hemi;

  // toon ramp
  const ramp = new Uint8Array([90, 90, 110, 255, 175, 165, 185, 255, 255, 255, 255, 255]);
  const grad = new THREE.DataTexture(ramp, 3, 1, THREE.RGBAFormat);
  grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.generateMipmaps = false; grad.needsUpdate = true;
  G.grad = grad;
  G.outlineMat = new THREE.MeshBasicMaterial({ color: 0x14101f, side: THREE.BackSide, fog: true });
  G.lineMat = new THREE.LineBasicMaterial({ color: 0x14101f, fog: true, transparent: true, opacity: 0.85 });
  G.toonCache = {};
  window.addEventListener('resize', onResize);
  onResize();
}
function onResize() {
  if (!G.renderer) return;
  const w = window.innerWidth, h = window.innerHeight;
  G.renderer.setSize(w, h, false);
  G.camera.aspect = w / h;
  G.camera.fov = w < h ? 80 : 66;
  G.camera.updateProjectionMatrix();
}
function toon(color, opts = {}) {
  const { noCache, ...rest } = opts || {};
  const key = color + JSON.stringify(rest);
  if (!noCache && G.toonCache[key]) return G.toonCache[key];
  const m = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: G.grad }, rest));
  if (!noCache) G.toonCache[key] = m;
  return m;
}
function basic(color, opts = {}) { return new THREE.MeshBasicMaterial(Object.assign({ color }, opts)); }

// inverted-hull outline: a back-faced, slightly inflated copy behind the mesh
function outline(mesh, t = 0.04) {
  const g = mesh.geometry;
  if (!g.boundingBox) g.computeBoundingBox();
  const bb = g.boundingBox, size = bb.getSize(V3()), c = bb.getCenter(V3());
  const s = V3(size.x > 1e-4 ? (size.x + 2 * t) / size.x : 1, size.y > 1e-4 ? (size.y + 2 * t) / size.y : 1, size.z > 1e-4 ? (size.z + 2 * t) / size.z : 1);
  const o = new THREE.Mesh(g, G.outlineMat);
  o.scale.copy(s);
  o.position.set(c.x * (1 - s.x), c.y * (1 - s.y), c.z * (1 - s.z));
  o.raycast = () => {};
  mesh.add(o);
  return mesh;
}
// convenience: toon mesh + outline
function part(geo, color, t = 0.04, opts) {
  const m = new THREE.Mesh(geo, typeof color === 'object' ? color : toon(color, opts));
  if (t > 0) outline(m, t);
  return m;
}

// ---------- static geometry merger ----------
// Everything static is merged into a few big meshes per material, split into
// spatial chunks so the camera can skip what it can't see.
const CHUNK = 48;
class StaticBatch {
  constructor() { this.buckets = {}; this.lines = {}; }
  bucket(name, x, z) {
    const key = name + '|' + Math.floor(x / CHUNK) + ',' + Math.floor(z / CHUNK);
    return this.buckets[key] || (this.buckets[key] = { name, pos: [], nor: [], col: [], uv: [] });
  }
  // kind: 'building' (windows on sides, roof on top), 'plain', 'roofonly' and any material name
  add(geo, matrix, color, kind = 'plain', { outlineT = 0.12, edges = true, uvScale = 8, roofColor = null } = {}) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (matrix) g.applyMatrix4(matrix);
    if (!g.attributes.normal) g.computeVertexNormals();
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    const col = new THREE.Color(color), rcol = new THREE.Color(roofColor || color);
    for (let i = 0; i < p.length; i += 9) {
      const ny = (n[i + 1] + n[i + 4] + n[i + 7]) / 3, nx = (n[i] + n[i + 3] + n[i + 6]) / 3, nz = (n[i + 2] + n[i + 5] + n[i + 8]) / 3;
      let bn = kind;
      if (kind === 'building') bn = Math.abs(ny) > 0.5 ? 'roof' : 'wall';
      else if (this.split && this.split[kind]) bn = Math.abs(ny) > 0.5 ? this.split[kind][0] : this.split[kind][1];
      else if (kind === 'roofonly') bn = 'roof';
      else if (kind === 'metal') bn = 'plain';
      const cx = (p[i] + p[i + 3] + p[i + 6]) / 3, cz = (p[i + 2] + p[i + 5] + p[i + 8]) / 3;
      const b = this.bucket(bn, cx, cz);
      const shade = ny < -0.5 ? 0.55 : 1;
      const cc = bn === 'roof' && roofColor ? rcol : col;
      for (let k = 0; k < 3; k++) {
        const j = i + k * 3;
        b.pos.push(p[j], p[j + 1], p[j + 2]);
        b.nor.push(n[j], n[j + 1], n[j + 2]);
        b.col.push(cc.r * shade, cc.g * shade, cc.b * shade);
        let u, v;
        const ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz);
        if (ay >= ax && ay >= az) { u = p[j]; v = p[j + 2]; }
        else if (ax >= az) { u = p[j + 2] * Math.sign(nx || 1); v = p[j + 1]; }
        else { u = -p[j] * Math.sign(nz || 1); v = p[j + 1]; }
        b.uv.push(u / uvScale, v / uvScale);
      }
    }
    if (outlineT > 0) {
      g.computeBoundingBox();
      const bb = g.boundingBox, size = bb.getSize(V3()), c = bb.getCenter(V3());
      const og = g.clone();
      const sx = size.x > 1e-4 ? (size.x + 2 * outlineT) / size.x : 1, sy = size.y > 1e-4 ? (size.y + 2 * outlineT) / size.y : 1, sz = size.z > 1e-4 ? (size.z + 2 * outlineT) / size.z : 1;
      og.applyMatrix4(new THREE.Matrix4().makeTranslation(c.x, c.y, c.z).multiply(new THREE.Matrix4().makeScale(sx, sy, sz)).multiply(new THREE.Matrix4().makeTranslation(-c.x, -c.y, -c.z)));
      this.addOutline(og);
    }
    if (edges) {
      const eg = new THREE.EdgesGeometry(geo, 30); if (matrix) eg.applyMatrix4(matrix);
      const a = eg.attributes.position.array;
      for (let i = 0; i < a.length; i += 6) {
        const key = Math.floor((a[i] + a[i + 3]) / 2 / CHUNK) + ',' + Math.floor((a[i + 2] + a[i + 5]) / 2 / CHUNK);
        const L = this.lines[key] || (this.lines[key] = []);
        for (let k = 0; k < 6; k++) L.push(a[i + k]);
      }
    }
  }
  // back-faced hull geometry already shaped as an outline (e.g. a fatter tube)
  addOutline(geo) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    const op = g.attributes.position.array;
    for (let i = 0; i < op.length; i += 9) {
      const b = this.bucket('outline', (op[i] + op[i + 3] + op[i + 6]) / 3, (op[i + 2] + op[i + 5] + op[i + 8]) / 3);
      for (let k = 0; k < 9; k++) b.pos.push(op[i + k]);
    }
  }
  box(x0, y0, z0, x1, y1, z1, color, kind = 'plain', opts) {
    const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
    const m = new THREE.Matrix4().makeTranslation((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    this.add(geo, m, color, kind, opts);
  }
  build(materials) {
    const group = new THREE.Group();
    for (const key in this.buckets) {
      const b = this.buckets[key], name = b.name;
      if (!b.pos.length) continue;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
      if (name === 'outline') { group.add(new THREE.Mesh(g, G.outlineMat)); continue; }
      g.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
      const mesh = new THREE.Mesh(g, materials[name] || materials.plain);
      if (name === 'water' || name === 'glow') mesh.renderOrder = 3;
      group.add(mesh);
    }
    for (const key in this.lines) {
      const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(this.lines[key], 3));
      group.add(new THREE.LineSegments(lg, G.lineMat));
    }
    return group;
  }
}

// tube along a polyline, with parallel-transport frames (rails, pipes, cables)
function tubeGeo(pts, r, radial = 6) {
  const n = pts.length, pos = [], nor = [], idx = [];
  const T = [], N = [], Bn = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    T.push(V3().subVectors(b, a).normalize());
  }
  let nn = Math.abs(T[0].y) < 0.9 ? V3(0, 1, 0) : V3(1, 0, 0);
  nn = V3().crossVectors(T[0], nn).normalize();
  for (let i = 0; i < n; i++) {
    if (i > 0) { const bb = V3().crossVectors(T[i - 1], T[i]); if (bb.length() > 1e-6) { bb.normalize(); const ang = Math.acos(U.clamp(T[i - 1].dot(T[i]), -1, 1)); nn.applyAxisAngle(bb, ang); } }
    N.push(nn.clone()); Bn.push(V3().crossVectors(T[i], nn).normalize());
  }
  for (let i = 0; i < n; i++) for (let k = 0; k <= radial; k++) {
    const a = k / radial * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const nx = N[i].x * c + Bn[i].x * s, ny = N[i].y * c + Bn[i].y * s, nz = N[i].z * c + Bn[i].z * s;
    pos.push(pts[i].x + nx * r, pts[i].y + ny * r, pts[i].z + nz * r); nor.push(nx, ny, nz);
  }
  for (let i = 0; i < n - 1; i++) for (let k = 0; k < radial; k++) {
    const a = i * (radial + 1) + k, b = a + radial + 1;
    idx.push(a, a + 1, b, b, a + 1, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

// ---------- canvas textures ----------
function canvasTex(w, h, draw, { repeat = false, nearest = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  if (repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; }
  if (nearest) { tex.magFilter = THREE.NearestFilter; }
  tex.anisotropy = 4;
  const o = { c, x, tex, draw, redraw(...a) { draw(x, w, h, ...a); tex.needsUpdate = true; } };
  o.redraw();
  return o;
}

const PAL = {
  ink: '#14101f', yellow: '#ffd23f', magenta: '#ff2e88', cyan: '#19d3ff', mint: '#8ff0c8', mintDark: '#2e9b7a',
  pink: '#ffb3d1', orange: '#ff7a2f', violet: '#6a3df0', lime: '#c6ff3d', cream: '#fff6e8'
};

function faceTextures(skin, style) {

      else if (kind === 'closed') { x.beginPath(); x.moveTo(cx - 9, eyeY + 2); x.lineTo(cx + 9, eyeY + 2); x.stroke(); }
      else if (kind === 'wide') { x.fillStyle = '#fff'; x.beginPath(); x.ellipse(cx, eyeY, 10, 13, 0, 0, 7); x.fill(); x.stroke(); x.fillStyle = PAL.ink; x.beginPath(); x.arc(cx, eyeY + 1, 4, 0, 7); x.fill(); }
      else if (kind === 'smug') { x.beginPath(); x.ellipse(cx, eyeY + 2, 7, 9, 0, 0, 7); x.fill(); x.lineWidth = 5; x.beginPath(); x.moveTo(cx - 12, eyeY - 4); x.lineTo(cx + 12, eyeY - 6); x.stroke(); x.lineWidth = 6; }

    };
    const e = { neutral: 'dot', talk: 'dot', grin: 'happy', mega: 'happy', shock: 'wide', smug: 'smug', worried: 'dot', blink: 'closed' }[mood] || 'dot';
    eye(64 - ex, e); eye(64 + ex, e);
    if (mood === 'worried') { x.lineWidth = 4; x.beginPath(); x.moveTo(64 - ex - 10, eyeY - 18); x.lineTo(64 - ex + 8, eyeY - 22); x.moveTo(64 + ex + 10, eyeY - 18); x.lineTo(64 + ex - 8, eyeY - 22); x.stroke(); x.lineWidth = 6; }

      x.strokeStyle = '#8ff0c8'; x.lineWidth = 3; x.beginPath(); x.moveTo(44, 90); x.quadraticCurveTo(64, 93, 84, 90); x.stroke();

    } else if (mood === 'grin' || mood === 'mega') {

    else if (mood === 'shock') { x.fillStyle = '#7a1f3d'; x.beginPath(); x.ellipse(64, 90, 7, 11, 0, 0, 7); x.fill(); x.stroke(); }
    else if (mood === 'smug') { x.beginPath(); x.moveTo(52, 86); x.quadraticCurveTo(66, 92, 78, 80); x.stroke(); }
    else if (mood === 'worried') { x.beginPath(); x.moveTo(52, 90); x.quadraticCurveTo(58, 84, 64, 89); x.quadraticCurveTo(70, 94, 76, 88); x.stroke(); }

function crtFaces() {
  const draw = (mood) => canvasTex(128, 96, (x, w, h) => {
    x.fillStyle = '#0e2a3a'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 380; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }

    const eyes = { neutral: 'sq', talk: 'sq', grin: 'up', mega: 'up', shock: 'big', smug: 'flat', worried: 'tilt', blink: 'flat' }[mood] || 'sq';
    for (const cx of [38, 90]) {
      if (eyes === 'sq') x.fillRect(cx - p, 28, p * 2, p * 2);
      else if (eyes === 'big') x.fillRect(cx - p * 1.4, 22, p * 2.8, p * 2.8);
      else if (eyes === 'flat') x.fillRect(cx - p, 36, p * 2, p * 0.7);
      else if (eyes === 'up') { x.fillRect(cx - p, 36, p * 0.7, p * 0.7); x.fillRect(cx - p * 0.35, 30, p * 0.7, p * 0.7); x.fillRect(cx + p * 0.3, 36, p * 0.7, p * 0.7); }

    else if (mood === 'talk') x.fillRect(46, 58, 36, 16);
    else if (mood === 'shock') x.fillRect(54, 56, 20, 22);
    else if (mood === 'worried') { x.fillRect(40, 66, 14, 6); x.fillRect(52, 62, 24, 6); x.fillRect(74, 66, 14, 6); }

    for (let y = 0; y < h; y += 4) { x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(0, y, w, 2); }
  }, { nearest: true });
  const out = {}; for (const m of ['neutral', 'talk', 'grin', 'mega', 'shock', 'smug', 'worried', 'blink']) out[m] = draw(m).tex; return out;
}

      aR: [-sw * 0.9 * amp + 0.1, 0, -0.25 - amp * 0.1, 0.4 + amp * 0.3],
      head: [-0.1 * amp, 0, -sw * 0.05 * amp]

  // ---------- scales and harmony ----------
  const MODES = { major: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10], aeolian: [0, 2, 3, 5, 7, 8, 10], mixolydian: [0, 2, 4, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10], lydian: [0, 2, 4, 6, 7, 9, 11], hijaz: [0, 1, 4, 5, 7, 8, 10], penta: [0, 2, 4, 7, 9] };
  const H = { root: 62, mode: MODES.dorian, deg: 0, next: null, bell: 0 };   // root as a midi note (D4)
  // midi note for a scale degree (can be negative / beyond 7), relative to the current root
  const deg = (dd, oct = 0) => { const m = H.mode, n = m.length, o = Math.floor(dd / n), k = ((dd % n) + n) % n; return H.root + m[k] + 12 * (o + oct); };

    pos.sort((a, b) => a - b);
    for (let i = 0; i < pos.length; i++) {
      if (r() < rest) continue;
      d += Math.round((r() - 0.5) * span); d = U.clamp(d, -3, 9);
      const len = (pos[i + 1] ?? steps) - pos[i];
      out.push([pos[i], d, Math.max(1, len)]);

  // ---------- the recipes ----------

  const REC = {
    business: {   // fast, jazzy, syncopated
      bpm: 124, beats: 4, sub: 4, swing: 0.16, root: 62, mode: 'dorian', rev: 0.25, dly: 0.18,
      prog: [[0, 7], [3, 7], [1, 7], [4, 7]],      // i9 – IV13 – ii – v (D dorian vamp)
      play(c) {

    },
    park: {       // slow, wooden, dark: 12/8 under big trees
      bpm: 66, beats: 4, sub: 3, swing: 0, root: 64, mode: 'aeolian', rev: 0.5, dly: 0.25,
      prog: [[0, 7], [5, 7], [2, 7], [6, 7], [0, 7], [3, 7], [4, 7], [0, 7]],

// ============================================================
//  METRO — a two-track loop on viaducts, seven stations, a gallery
//  through the ridge between Park and Hilltop. Trains you can ride on
//  (roof) and that knock you off the rails.
// ============================================================
// the loop, as drawn on the sketch (cubic Béziers in map units), starting at Hilltop
const METRO_SVG = [
  [[235, 115], [255, 150], [270, 200], [280, 262]],
  [[280, 262], [290, 320], [300, 350], [295, 400]],
  [[295, 400], [280, 425], [240, 445], [205, 440]],
  [[205, 440], [165, 435], [130, 400], [125, 350]],
  [[125, 350], [122, 310], [170, 290], [195, 265]],
  [[195, 265], [160, 230], [110, 175], [80, 175]],
  [[80, 175], [120, 150], [190, 120], [235, 115]],

function planMetro() {
  // sample the Béziers evenly

      const t = i / 400, a = 1 - t;

    const t = L > 0 ? (s - acc[k]) / L : 0;

  const stations = PLAN.stations.map(st => {
    let bi = 0, bd = 1e9; pts.forEach((p, i) => { const d = Math.hypot(p.x - st.at[0], p.z - st.at[1]); if (d < bd) { bd = d; bi = i; } });

  const ground = pts.map(p => terrainAt(p.x, p.z));

// position on the loop at arc length s, offset sideways by `off` (+ = right of travel)
function metroAt(M, s, off = 0, out = {}) {
  s = ((s % M.L) + M.L) % M.L;

// ---------- building the line ----------
function buildMetro(K, M, S, F) {

  const lakeUV = lake.geometry.attributes.uv; for (let i = 0; i < lakeUV.count; i++) lakeUV.setXY(i, lakeUV.getX(i) * 900, lakeUV.getY(i) * 600); lakeUV.needsUpdate = true;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(12000, 8000), new THREE.MeshBasicMaterial({ color: 0x23485a })); floor.rotation.x = -Math.PI / 2; floor.position.set(0, -14, 3000); W.group.add(floor);
  W.waters.push({ x0: -6000, z0: 1150, x1: 6000, z1: 9000, y: 0, deep: true, lake: true });
  W.lakeMat = lakeMat;
  buildCanal(K, S, F);
  buildRoads(K, S, F);
  buildMetro(K, M, S, F);
  buildStations(K, M, S, F);
  buildDistricts(K, S, F);
  // the edges of the world: soft invisible walls on the hills
  for (const b of [[-1300, -1700, -1050, 1300], [1052, -1700, 1300, 1300], [-1300, -1700, 1300, -1480]]) W.boxes.push({ x0: b[0], y0: -50, z0: b[1], x1: b[2], y1: 400, z1: b[3], tag: 'edge', nocam: true });
  K.finish();
  // ground = terrain (with canals open), slabs, train roofs, plus kit boxes
  W.groundExtra = (x, z, yMax, r) => {
    let y = inCanal(x, z) ? PLAN.canal.bedY : inHole(x, z) ? -1e9 : terrainAt(x, z), hit = TERRAIN_HIT;

    const s = S.query(x, z, yMax, Math.min(r, 0.2)); if (s && s.y > y) { y = s.y; hit = s.hit; }
    if (W.trainsys) { const t = W.trainsys.ground(x, z, yMax); if (t && t.y > y) { y = t.y; hit = t.hit; } }
    return hit ? { y, hit } : null;
  };
  W.group.add(F.build(mats.far));
  console.log('city built in ' + Math.round(performance.now() - T0) + ' ms');
  W.trainsys = makeTrains(W, M, W.group);
  W.dyn.push({ update: (dt) => W.trainsys.update(dt) });
  // visibility of the detailed cells
  W.updateCells = (cx, cz, R = 340) => {
    for (const g of W.cells.values()) {
      const d = Math.hypot(g.userData.cx - cx, g.userData.cz - cz);
      g.visible = g.visible ? d < R + 40 : d < R;
    }
  };
  return W;
}

// ---------- canal ----------
function buildCanal(K, S, F) {
  const W = K.W, C = PLAN.canal, B = K.B;
  const wall = '#8f8577', top = '#b9b0a0';
  const sz = shoreZ(C.bendX) + 4;
  // walls (thin boxes from the bed up to the quay), a stone coping on top
  const walls = [
    [C.x0, C.z - C.half - 1, C.bendX + C.half, C.z - C.half],             // north
    [C.x0, C.z + C.half, C.bendX - C.half, C.z + C.half + 1],             // south (west of the bend)
    [C.bendX - C.half - 1, C.z + C.half, C.bendX - C.half, sz],           // west side of the bend
    [C.bendX + C.half, C.z - C.half, C.bendX + C.half + 1, sz],           // east side of the bend
  ];
  for (const [x0, z0, x1, z1] of walls) {
    // in pieces, so the cells can cull them
    const alongX = x1 - x0 > z1 - z0, L = alongX ? x1 - x0 : z1 - z0;
    for (let s = 0; s < L; s += 32) {
      const a = s, b = Math.min(L, s + 32);
      const X0 = alongX ? x0 + a : x0, X1 = alongX ? x0 + b : x1, Z0 = alongX ? z0 : z0 + a, Z1 = alongX ? z1 : z0 + b;
      B.box(X0, C.bedY, Z0, X1, C.quayY - 0.05, Z1, wall, 'brick', { outlineT: 0, edges: false });
      B.box(X0 - (alongX ? 0 : 0.4), C.quayY - 0.05, Z0 - (alongX ? 0.4 : 0), X1 + (alongX ? 0 : 0.4), C.quayY + 0.2, Z1 + (alongX ? 0.4 : 0), top, 'paving', { outlineT: 0.04, edges: false });
    }
  }
  // the bed
  for (let x = C.x0; x < C.bendX + C.half; x += 64) B.box(x, C.bedY - 0.5, C.z - C.half, Math.min(C.bendX + C.half, x + 64), C.bedY, C.z + C.half, '#4a5a50', 'plain', { outlineT: 0, edges: false });
  for (let z = C.z + C.half; z < sz; z += 64) B.box(C.bendX - C.half, C.bedY - 0.5, z, C.bendX + C.half, C.bedY, Math.min(sz, z + 64), '#4a5a50', 'plain', { outlineT: 0, edges: false });
  // water: separate meshes (always drawn) + the deep-water zones
  const wm = new THREE.MeshBasicMaterial({ color: 0x5f9fa0, map: W.mats.waterTex, transparent: true, opacity: 0.8, depthWrite: false });
  const addWater = (x0, z0, x1, z1) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), wm); m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, C.waterY, (z0 + z1) / 2); m.renderOrder = 3;
    const uv = m.geometry.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * (x1 - x0) / 10, uv.getY(i) * (z1 - z0) / 10); uv.needsUpdate = true;
    W.group.add(m);
    W.waters.push({ x0, z0, x1, z1, y: C.waterY, deep: true, canal: true });
  };
  addWater(C.x0, C.z - C.half, C.bendX + C.half, C.z + C.half);
  addWater(C.bendX - C.half, C.z + C.half, C.bendX + C.half, sz);
  W.canalWaterMat = wm;
  // the weir where the canal steps down into the lake
  K.waterfall(C.bendX - C.half, C.bendX + C.half, sz, C.waterY, 0.05, '#cfeff0');
  F.box(C.x0, C.bedY, C.z - C.half - 1, C.bendX + C.half + 1, C.quayY, C.z - C.half, wall, 0);
  W.canal = C;
}

// ---------- the big roads (district streets are laid by each district) ----------
const ROADS = {
  boulevard: [[432, -720], [432, -360], [432, 0], [432, 400], [432, 800], [432, 1190]],
  avenue: [[-1040, 336], [-600, 336], [-200, 336], [200, 336], [432, 336], [800, 336], [1040, 336]],
  hill: [[432, -720], [520, -790], [660, -852], [600, -905], [372, -960], [290, -1000], [216, -1044]],
};
function buildRoads(K, S, F) {
  const W = K.W, B = K.B;
  W.roads = {};
  for (const [key, pts] of Object.entries(ROADS)) {
    const width = key === 'boulevard' ? 20 : key === 'avenue' ? 16 : 11;
    // sidewalks first (wider, paler), then the asphalt on top
    groundRibbon(B, pts, width + 7, '#c8c1b4', 'walk', 0.07);
    const P = groundRibbon(B, pts, width, '#5a5868', 'road', 0.1);
    roadDashes(B, P);
    W.roads[key] = { pts, width, P };
  }
}
// a bridge between two quay points (flat or arched by `rise`); also used over the canal
function bridge(K, S, F, ax, az, bx, bz, width, rise = 1.4, o = {}) {
  const W = K.W, B = K.B, C = PLAN.canal;
  const ya = terrainAt(ax, az) + 0.05, yb = terrainAt(bx, bz) + 0.05, mx = (ax + bx) / 2, mz = (az + bz) / 2, ym = Math.max(ya, yb) + rise;
  const L = Math.hypot(bx - ax, bz - az), yaw = Math.atan2(bx - ax, bz - az);
  S.add(ax, ya, az, mx, ym, mz, width / 2 - 0.3); S.add(mx, ym, mz, bx, yb, bz, width / 2 - 0.3);
  const n = 8, col = o.color || '#b0a18a';
  for (let k = 0; k < n; k++) {
    const t0 = k / n, t1 = (k + 1) / n, y0 = t0 < 0.5 ? U.lerp(ya, ym, U.smooth(t0 * 2)) : U.lerp(ym, yb, U.smooth(t0 * 2 - 1)), y1 = t1 < 0.5 ? U.lerp(ya, ym, U.smooth(t1 * 2)) : U.lerp(ym, yb, U.smooth(t1 * 2 - 1));
    const x0 = U.lerp(ax, bx, t0), z0 = U.lerp(az, bz, t0), x1 = U.lerp(ax, bx, t1), z1 = U.lerp(az, bz, t1);
    const segL = Math.hypot(x1 - x0, z1 - z0), mid = V3((x0 + x1) / 2, (y0 + y1) / 2 - 0.45, (z0 + z1) / 2);
    const m = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(-Math.atan2(y1 - y0, segL), yaw, 0, 'YXZ')).setPosition(mid);
    B.add(new THREE.BoxGeometry(width, 0.9, segL + 0.06), m, col, o.kind || 'paving', { outlineT: 0.06, edges: false });
  }
  // abutments on each bank
  for (const [x, z, y] of [[ax, az, ya], [bx, bz, yb]]) {
    const m = new THREE.Matrix4().makeRotationY(yaw).setPosition(x, (C.bedY + y) / 2 - 0.3, z);
    B.add(new THREE.BoxGeometry(width + 0.6, y - C.bedY, 3), m, o.wall || '#8f8577', 'brick', { outlineT: 0.05, edges: false });
  }
  // parapets (grindable rails on top)
  for (const sd of [-1, 1]) {
    const rx = Math.cos(yaw) * sd * (width / 2 - 0.3), rz = -Math.sin(yaw) * sd * (width / 2 - 0.3), pts = [];
    for (let k = 0; k <= 12; k++) { const t = k / 12, y = t < 0.5 ? U.lerp(ya, ym, U.smooth(t * 2)) : U.lerp(ym, yb, U.smooth(t * 2 - 1)); pts.push([U.lerp(ax, bx, t) + rx, y + 1.0, U.lerp(az, bz, t) + rz]); }
    K.rail(pts, { color: o.rail || '#e9e4f5', postColor: '#6a6458', postMax: 1.2, round: 0, radius: 0.07 });
  }
  F.add(new THREE.BoxGeometry(width - 0.6, 0.8, L), new THREE.Matrix4().makeRotationY(yaw).setPosition(mx, (ya + yb) / 2 + rise * 0.6 - 0.5, mz), col);
  return { ax, az, bx, bz, ym };
}

// ============================================================
//  DISTRICTS — shared helpers, then one builder per district
// ============================================================
function districtKit(K, S, F) {
  const W = K.W, B = K.B;
  const H = { K, S, F, W, B };
  // keep things off the metro viaduct, the big roads and the canal
  const M = W.metro;
  H.clearOf = (x0, z0, x1, z1, pad = 3) => {
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, rr = Math.hypot(x1 - x0, z1 - z0) / 2 + pad;
    if (M) for (let i = 0; i < M.N; i += 2) { const p = M.pts[i]; if (Math.abs(p.x - cx) > rr + 12 || Math.abs(p.z - cz) > rr + 12) continue; if (rectDist([x0 - pad, z0 - pad, x1 + pad, z1 + pad], p.x, p.z) < METRO.deckW / 2 + 1.5) return false; }
    for (const st of (W.stations || [])) for (const rp of st.ramps) { const dx = rp.to[0] - rp.from[0], dz = rp.to[1] - rp.from[1], L = Math.hypot(dx, dz); for (let t = 0; t <= L; t += 4) if (rectDist([x0 - pad, z0 - pad, x1 + pad, z1 + pad], rp.from[0] + dx * t / L, rp.from[1] + dz * t / L) < 3) return false; }
    for (const r of Object.values(W.roads || {})) for (let i = 0; i < r.pts.length - 1; i++) {
      const [ax, az] = r.pts[i], [bx, bz] = r.pts[i + 1], L = Math.hypot(bx - ax, bz - az);
      for (let t = 0; t <= L; t += 6) if (rectDist([x0 - pad, z0 - pad, x1 + pad, z1 + pad], ax + (bx - ax) * t / L, az + (bz - az) * t / L) < r.width / 2 + 3.5) return false;
    }
    for (const x of [x0, x1, cx]) for (const z of [z0, z1, cz]) if (inCanal(x, z)) return false;
    for (const b of (H.reserved || [])) if (x1 + pad > b[0] && x0 - pad < b[2] && z1 + pad > b[1] && z0 - pad < b[3]) return false;
    for (const [P, hw] of H.lines) for (let i = 0; i < P.length - 1; i++) {
      const [ax, az] = P[i], [bx, bz] = P[i + 1];
      if (Math.max(ax, bx) + hw < x0 - pad || Math.min(ax, bx) - hw > x1 + pad || Math.max(az, bz) + hw < z0 - pad || Math.min(az, bz) - hw > z1 + pad) continue;
      const L = Math.hypot(bx - ax, bz - az); for (let t = 0; t <= L; t += 2) if (rectDist([x0 - pad, z0 - pad, x1 + pad, z1 + pad], ax + (bx - ax) * t / L, az + (bz - az) * t / L) < hw) return false;
    }
    return true;
  };
  H.reserved = []; H.lines = [];
  H.line = (P, hw) => H.lines.push([P, hw]);
  H.reserve = (r) => H.reserved.push(r);
  // a building standing on the slope (its floor line is the highest corner)
  H.bldg = (x0, z0, x1, z1, h, col, o = {}) => {
    const [lo, hi] = groundSpan(x0, z0, x1, z1);
    const base = lo - 1.5, top = (o.top ?? hi + h);
    K.box(x0, base, z0, x1, top, z1, col, o.kind || 'building', { roofColor: o.roof || col, outlineT: o.outline ?? 0.16 });
    if (o.trim !== false) B.box(x0 - 0.2, top - 0.7, z0 - 0.2, x1 + 0.2, top - 0.05, z1 + 0.2, o.trim || '#3a3550', 'plain', { outlineT: 0, edges: false });
    F.box(x0, base, z0, x1, top, z1, o.far || col);
    return { base, top, lo, hi };
  };
  // pitched roof: two kit ramps (so you can skate up one side and off the other)
  H.roof = (x0, z0, x1, z1, y, rise, col, alongX = null) => {
    const ax = alongX ?? (x1 - x0 < z1 - z0);       // ridge runs along the long side; slopes across the short one
    if (ax) { const m = (x0 + x1) / 2; K.ramp(x0 - 0.4, z0 - 0.4, m, z1 + 0.4, 'x', y, y + rise, col, false, y - 0.3, 'roof'); K.ramp(m, z0 - 0.4, x1 + 0.4, z1 + 0.4, 'x', y + rise, y, col, false, y - 0.3, 'roof'); }
    else { const m = (z0 + z1) / 2; K.ramp(x0 - 0.4, z0 - 0.4, x1 + 0.4, m, 'z', y, y + rise, col, false, y - 0.3, 'roof'); K.ramp(x0 - 0.4, m, x1 + 0.4, z1 + 0.4, 'z', y + rise, y, col, false, y - 0.3, 'roof'); }
    const g = ax ? prismGeo(x1 - x0 + 0.8, rise, z1 - z0 + 0.8, true) : prismGeo(x1 - x0 + 0.8, rise, z1 - z0 + 0.8, false);
    F.add(g, new THREE.Matrix4().makeTranslation((x0 + x1) / 2, y, (z0 + z1) / 2), col);
  };
  // trees: faceted canopies (flat-shaded), trunk collider; big ones have no camera box (you're under them)
  H.tree = (x, z, o = {}) => {
    const s = o.s ?? 1, h = (o.h ?? 4) * s, r = (o.r ?? 2.6) * s, y = o.y ?? terrainAt(x, z), col = o.color || '#3f8a4a', rot = (x * 13.1 + z * 7.7) % 6.28;
    K.cyl(x, y - 0.3, z, 0.28 * s, h + 0.6, o.trunk || '#6b4a35', { outline: 0.05 * s, seg: 6, r2: 0.4 * s });
    const blob = (bx, by, bz, br, c) => B.add(flatGeo(new THREE.IcosahedronGeometry(br, 0)), new THREE.Matrix4().compose(V3(bx, by, bz), new THREE.Quaternion().setFromEuler(new THREE.Euler(rot, rot * 2, 0)), V3(1, o.squash ?? 0.85, 1)), c, 'flat', { outlineT: 0.14 * s, edges: false });
    blob(x, y + h + r * 0.55, z, r, col);
    if (!o.single) { blob(x + r * 0.55, y + h + r * 0.15, z + r * 0.25, r * 0.66, o.color2 || col); blob(x - r * 0.45, y + h + r * 0.25, z - r * 0.35, r * 0.62, o.color2 || col); }
    W.boxes.push({ x0: x - 0.4 * s, y0: y - 1, z0: z - 0.4 * s, x1: x + 0.4 * s, y1: y + h, z1: z + 0.4 * s, tag: 'tree' });
    if (!o.tall) W.camBoxes.push({ x0: x - r, y0: y + h, z0: z - r, x1: x + r, y1: y + h + r * 1.4, z1: z + r });
    if (o.far !== false) F.add(new THREE.IcosahedronGeometry(r * 0.9, 0), new THREE.Matrix4().compose(V3(x, y + h + r * 0.55, z), new THREE.Quaternion(), V3(1, 0.8, 1)), o.farColor || col);
  };
  H.pine = (x, z, o = {}) => {
    const s = o.s ?? 1, y = o.y ?? terrainAt(x, z), col = o.color || '#2f5a3a';
    K.cyl(x, y - 0.3, z, 0.25 * s, 2.2 * s, '#5b4030', { outline: 0.04, seg: 5 });
    for (let k = 0; k < 3; k++) B.add(flatGeo(new THREE.ConeGeometry((2.4 - k * 0.6) * s, 3.2 * s, 6)), new THREE.Matrix4().makeTranslation(x, y + (2.6 + k * 1.7) * s, z), col, 'flat', { outlineT: 0.1, edges: false });
    W.boxes.push({ x0: x - 0.35, y0: y - 1, z0: z - 0.35, x1: x + 0.35, y1: y + 3, z1: z + 0.35, tag: 'tree' });
    if (o.far !== false) F.add(new THREE.ConeGeometry(2.0 * s, 6 * s, 5), new THREE.Matrix4().makeTranslation(x, y + 4.2 * s, z), col);
  };
  // street lamp (glows at night) — lamps also chime softly as you pass (an instrument)
  H.lamp = (x, z, o = {}) => {
    const y = o.y ?? terrainAt(x, z), h = o.h ?? 4.6, col = o.color || '#2e2b3a';
    K.cyl(x, y - 0.2, z, 0.09, h + 0.2, col, { outline: 0.03, seg: 6 });
    if (o.style === 'globe') K.sphere(x, y + h + 0.25, z, 0.38, '#fff1c8', { kind: 'lamp', outline: 0.04, seg: 8 });
    else { B.box(x - 0.32, y + h - 0.1, z - 0.32, x + 0.32, y + h + 0.05, z + 0.32, col, 'plain', { outlineT: 0.02, edges: false }); B.box(x - 0.24, y + h - 0.5, z - 0.24, x + 0.24, y + h - 0.1, z + 0.24, o.glow || '#ffe2a6', 'lamp', { outlineT: 0.02, edges: false }); }
    W.boxes.push({ x0: x - 0.14, y0: y - 1, z0: z - 0.14, x1: x + 0.14, y1: y + h, z1: z + 0.14, tag: 'lamp' });
    W.lamps.push([x, y + h, z]);
    if (o.sound !== false) H.sound(x, y + 1, z, 1.6, o.sound || 'lamp');
  };
  H.bench = (x, z, alongX = true, o = {}) => {
    const y = o.y ?? terrainAt(x, z) + 0.02;
    K.bench(x, z, alongX, y, o.color || '#b8743a', o.rail ?? true);
    W.benches.push({ x, y, z, alongX, view: o.view });
  };
  // a paved patch that follows the ground (sampled on the terrain grid so it sits flush)
  H.patch = (r, color, kind = 'walk', lift = 0.06) => {
    const pos = [], st = 8;
    const sx0 = Math.floor((r[0] - TER.x0) / st) * st + TER.x0, sz0 = Math.floor((r[1] - TER.z0) / st) * st + TER.z0;
    for (let x = sx0; x < r[2]; x += st) for (let z = sz0; z < r[3]; z += st) {
      const a = Math.max(x, r[0]), b = Math.min(x + st, r[2]), c = Math.max(z, r[1]), d = Math.min(z + st, r[3]);
      if (b - a < 0.05 || d - c < 0.05 || inHole((a + b) / 2, (c + d) / 2) || inCanal((a + b) / 2, (c + d) / 2)) continue;
      const P = (px, pz) => [px, terrainAt(px, pz) + lift, pz];
      // match the terrain's triangle split inside each grid cell
      const m = [(a + b) / 2, (c + d) / 2];
      pos.push(...P(a, c), ...P(a, d), ...P(m[0], m[1]), ...P(a, d), ...P(b, d), ...P(m[0], m[1]), ...P(b, d), ...P(b, c), ...P(m[0], m[1]), ...P(b, c), ...P(a, c), ...P(m[0], m[1]));
    }

  // interaction: something that plays a note when you pass close
  H.sound = (x, y, z, r, kind, data = {}) => { W.sounds.push({ x, y, z, r, kind, cd: 0, ...data }); };
  H.spot = (key, x, z, r, extra = {}) => { const y = terrainAt(x, z); W.spots.push(Object.assign({ key, x, y, z, r, w: 0 }, extra)); };
  // a busker: a person, an instrument case, a little tune that grows as you come close
  H.busker = (inst, x, z, yaw = 0) => {
    const y = terrainAt(x, z);
    H.standers([[x, z, yaw, y]], 'market');
    const cx = x + Math.sin(yaw) * 1.2, cz = z + Math.cos(yaw) * 1.2;
    B.box(cx - 0.45, y, cz - 0.2, cx + 0.45, y + 0.25, cz + 0.2, '#3a2a22', 'plain', { outlineT: 0.02, edges: false });
    B.box(cx - 0.4, y + 0.25, cz - 0.15, cx + 0.4, y + 0.28, cz + 0.15, '#a0302a', 'plain', { outlineT: 0, edges: false });
    W.spots.push({ key: 'busk_' + inst, x, y, z, r: 22, w: 0, busker: true });
  };
  // walking people (and standing ones); stored for the life system
  H.walkers = (paths, n, style) => W.npcs.push({ kind: 'walk', paths, n, style });
  H.standers = (pts, style) => W.npcs.push({ kind: 'stand', pts, style });
  return H;

// ============================================================
//  OLD TOWN — steep lanes, pastel houses with skateable roofs,
//  washing lines, a square with a bell tower (hidden spot)
// ============================================================
function buildOldTown(H) {
  const { K, W, B, F, S } = H, r = U.rng(404);
  const lanes = [
    [[560, -380], [600, -470], [660, -560], [700, -640], [640, -720], [720, -800], [800, -880], [760, -980], [840, -1080], [800, -1180], [880, -1280], [860, -1400]],
    [[470, -600], [560, -620], [660, -560], [780, -540], [900, -520], [1010, -560]],
    [[480, -1010], [600, -1040], [760, -980], [920, -1000], [1020, -940]],
    [[700, -640], [820, -700], [960, -740], [1020, -820]],
    [[800, -1180], [680, -1240], [560, -1300], [470, -1260]],
    [[880, -1280], [980, -1200], [1020, -1100]],
    [[640, -720], [560, -760], [480, -800]],
    [[840, -1080], [960, -1100], [1010, -1160]],
  ];
  const sq = [660, -570];
  // the square
  const sqR = [sq[0] - 26, sq[1] - 24, sq[0] + 26, sq[1] + 24];
  H.patch(sqR, '#c9b79a', 'walk', 0.07); H.reserve(sqR);
  for (const L of lanes) { H.path(L, 7, '#b8a88c', 'walk'); H.line(L, 3.5); }
  W.oldLanes = lanes;
  // the bell tower in the square's corner
  const tx = sq[0] + 14, tz = sq[1] - 12, ty = terrainAt(tx, tz);
  K.box(tx - 3.5, ty - 1, tz - 3.5, tx + 3.5, ty + 18, tz + 3.5, '#e8dcc4', 'brick', { outlineT: 0.12 });
  for (const [cx, cz] of [[-3, -3], [3, -3], [-3, 3], [3, 3]]) K.box(tx + cx - 0.5, ty + 18, tz + cz - 0.5, tx + cx + 0.5, ty + 23, tz + cz + 0.5, '#e8dcc4', 'brick', { outlineT: 0.06 });
  B.box(tx - 3.8, ty + 23, tz - 3.8, tx + 3.8, ty + 23.8, tz + 3.8, '#c9b89a', 'plain', { outlineT: 0.06 });
  B.add(new THREE.ConeGeometry(5.6, 7, 4), new THREE.Matrix4().makeRotationY(Math.PI / 4).setPosition(tx, ty + 27.3, tz), '#7a5a4a', 'roof', { outlineT: 0.1 });
  K.sphere(tx, ty + 20.4, tz, 1.4, '#b88a3a', { outline: 0.06, seg: 12, sy: 1.1 });
  F.box(tx - 3.5, ty - 1, tz - 3.5, tx + 3.5, ty + 23, tz + 3.5, '#e8dcc4'); F.add(new THREE.ConeGeometry(5.2, 7, 4), new THREE.Matrix4().makeRotationY(Math.PI / 4).setPosition(tx, ty + 27, tz), '#7a5a4a');
  W.bell = { x: tx, y: ty, z: tz };
  H.spot('belltower', tx, tz + 6, 30);
  // the square: a little fountain, café tables, pigeons
  const fx = sq[0] - 8, fz = sq[1] + 6, fy = terrainAt(fx, fz);
  K.cyl(fx, fy - 0.2, fz, 3, 0.7, '#b8a88c', { outline: 0.06, seg: 16 }); K.cyl(fx, fy, fz, 0.5, 1.8, '#b8a88c', { outline: 0.04, seg: 8 });
  W.boxes.push({ x0: fx - 2.6, y0: fy - 1, z0: fz - 2.6, x1: fx + 2.6, y1: fy + 0.5, z1: fz + 2.6 });
  (W.fountains = W.fountains || []).push({ x: fx, y: fy + 1.8, z: fz });
  H.sound(fx, fy, fz, 5, 'fountain');
  for (let i = 0; i < 6; i++) { const cx = sq[0] - 18 + (i % 3) * 7, cz = sq[1] - 14 + Math.floor(i / 3) * 7, cy = terrainAt(cx, cz); K.cyl(cx, cy, cz, 0.6, 0.75, '#efe8dc', { outline: 0.03, seg: 10 }); K.cyl(cx, cy, cz, 0.05, 2.3, '#3a3550', { outline: 0, seg: 4 }); B.add(new THREE.ConeGeometry(1.5, 0.6, 8), new THREE.Matrix4().makeTranslation(cx, cy + 2.5, cz), ['#c4523a', '#e8c84a', '#3e8f86'][i % 3], 'plain', { outlineT: 0.04, edges: false }); W.boxes.push({ x0: cx - 0.6, y0: cy, z0: cz - 0.6, x1: cx + 0.6, y1: cy + 0.75, z1: cz + 0.6 }); }
  (W.pigeonSpots = W.pigeonSpots || []).push([sq[0], sq[1] + 10, 10]);
  for (const [bx, bz] of [[sq[0] - 22, sq[1]], [sq[0] + 22, sq[1] + 6]]) H.bench(bx, bz, false, { view: true });
  H.busker('trumpet', sq[0] - 6, sq[1] - 16, 0);
  // houses along the lanes, sawtooth facades (they stay square to the compass)
  const pastel = ['#f2d7c0', '#e8c8a0', '#d9e0c8', '#c8d8e0', '#f0e0a0', '#e8b8a8', '#d0c0d8', '#f4ecd8', '#e0c8b8', '#c8dcd0'];
  const roofs = ['#b85a3a', '#a04a32', '#9a5a44', '#6a6a7a', '#b8643f'];
  const R = PLAN.byKey.oldtown.rect;
  for (const L of lanes) for (let i = 0; i < L.length - 1; i++) {
    const [ax, az] = L[i], [bx, bz] = L[i + 1], len = Math.hypot(bx - ax, bz - az), ux = (bx - ax) / len, uz = (bz - az) / len;
    for (let s = 6; s < len - 4; s += 8 + r() * 3) for (const side of [-1, 1]) {
      const w = 8 + r() * 4, d = 9 + r() * 5;
      const alongX = Math.abs(ux) > Math.abs(uz);
      const hx = alongX ? w / 2 : d / 2, hz = alongX ? d / 2 : w / 2;
      // push the (square-to-the-compass) house out until its nearest corner clears the lane
      const off = 4.6 + hx * Math.abs(uz) + hz * Math.abs(ux) + r() * 0.8;
      const cx = ax + ux * s - uz * off * side, cz = az + uz * s + ux * off * side;
      const x0 = cx - hx, z0 = cz - hz, x1 = cx + hx, z1 = cz + hz;
      if (rectDist(R, cx, cz) > -4 && rectDist(PLAN.byKey.obs.rect, cx, cz) > 0) { if (rectDist(R, cx, cz) > 30) continue; }
      if (!H.clearOf(x0, z0, x1, z1, 0.8)) continue;
      const hgt = 7 + r() * 6, bb = H.bldg(x0, z0, x1, z1, hgt, pick(r, pastel), { trim: '#6a5a4a', outline: 0.12, kind: 'house' });
      H.roof(x0, z0, x1, z1, bb.top, 2.6 + r() * 1.6, pick(r, roofs));
      H.reserve([x0, z0, x1, z1]);
      if (r() < 0.25) K.box(cx - 0.6, bb.top, cz - 0.6, cx + 0.6, bb.top + 3.4, cz + 0.6, '#8a7a6a', 'brick', { outlineT: 0.05 });   // chimney
    }
    // washing lines across the lane (grindable, with laundry)

      const s = len * (0.3 + r() * 0.4), cx = ax + ux * s, cz = az + uz * s, y = terrainAt(cx, cz) + 6.2;
      K.rail([[cx - uz * 6, y, cz + ux * 6], [cx + uz * 6, y, cz - ux * 6]], { kind: 'cable', laundry: true, posts: false, sag: 0.5 });
    }
    // lamps
    for (let s = 14; s < len; s += 36) { const x = ax + ux * s + uz * 3.6, z = az + uz * s - ux * 3.6; if (H.clearOf(x - 0.3, z - 0.3, x + 0.3, z + 0.3, 0)) H.lamp(x, z, { style: 'globe', h: 3.6, color: '#2a2a32' }); }
  }
  // more houses tucked into the gaps between lanes
  for (let i = 0; i < 900; i++) {
    const x = U.lerp(R[0] + 6, R[2] - 6, r()), z = U.lerp(R[1] + 6, R[3] - 6, r()), w = 8 + r() * 5, d = 8 + r() * 5;
    if (!H.clearOf(x - w / 2, z - d / 2, x + w / 2, z + d / 2, 2.5)) continue;
    const bb = H.bldg(x - w / 2, z - d / 2, x + w / 2, z + d / 2, 6 + r() * 6, pick(r, pastel), { trim: '#6a5a4a', outline: 0.12, kind: 'house' });
    H.roof(x - w / 2, z - d / 2, x + w / 2, z + d / 2, bb.top, 2.4 + r() * 1.5, pick(r, roofs));
    H.reserve([x - w / 2, z - d / 2, x + w / 2, z + d / 2]);
  }
  // gardens and trees in the gaps
  for (let i = 0; i < 260; i++) {
    const x = U.lerp(R[0], R[2], r()), z = U.lerp(R[1], R[3], r());
    if (H.clearOf(x - 2, z - 2, x + 2, z + 2, 1)) { H.tree(x, z, { s: 0.7 + r() * 0.4, color: pick(r, ['#5f8f4a', '#6f9a4a', '#4f7f45']), color2: '#7aa055' }); H.reserve([x - 2, z - 2, x + 2, z + 2]); }
  }
  H.walkers(lanes, 50, 'oldtown');
}

// ============================================================
//  MARKET — the hall, stall alleys, lantern strings, a sunken record shop
// ============================================================
function buildMarket(H) {
  const { K, W, B, F, S } = H, r = U.rng(505);
  const R = PLAN.byKey.market.rect;
  H.patch([R[0] + 4, R[1] + 4, R[2] - 4, R[3] - 4], '#c9a983', 'walk', 0.05);
  // the hall: columns, a big skateable gable roof
  const hx0 = 690, hz0 = -80, hx1 = 810, hz1 = -10;
  const [hlo, hhi] = groundSpan(hx0, hz0, hx1, hz1), hy = hhi + 9;
  for (let x = hx0; x <= hx1; x += 12) for (const z of [hz0, hz1]) { const gy = terrainAt(x, z); K.box(x - 0.6, gy - 1, z - 0.6, x + 0.6, hy, z + 0.6, '#7a5a3a', 'wood', { outlineT: 0.06 }); }
  for (let z = hz0 + 14; z < hz1; z += 14) for (const x of [hx0, hx1]) { const gy = terrainAt(x, z); K.box(x - 0.6, gy - 1, z - 0.6, x + 0.6, hy, z + 0.6, '#7a5a3a', 'wood', { outlineT: 0.06 }); }
  B.box(hx0 - 1, hy - 0.6, hz0 - 1, hx1 + 1, hy, hz1 + 1, '#6a4a2e', 'wood', { outlineT: 0.08 });
  W.boxes.push({ x0: hx0 - 1, y0: hy - 0.6, z0: hz0 - 1, x1: hx1 + 1, y1: hy, z1: hz1 + 1, tag: 'hallroof', nocam: true });
  H.roof(hx0 - 1, hz0 - 1, hx1 + 1, hz1 + 1, hy, 9, '#a0523a', false);
  W.camBoxes.push({ x0: hx0, y0: hy, z0: hz0, x1: hx1, y1: hy + 9, z1: hz1 });
  H.reserve([hx0 - 3, hz0 - 3, hx1 + 3, hz1 + 3]);
  // stalls: inside the hall and along alleys outside
  const stallCols = ['#c4523a', '#e8b84a', '#3e8f86', '#d9779a', '#4a6aa0', '#f2efe6', '#8a5a9e', '#6aa04a'];
  const produce = ['#e85a3a', '#f2b23a', '#7ac04a', '#c83a6a', '#f2e04a', '#8a4ac0', '#ff8a3a'];
  const stall = (x, z, alongX, col) => {
    const y = terrainAt(x, z), w = 3.6, d = 1.6;
    const [x0, z0, x1, z1] = alongX ? [x - w / 2, z - d / 2, x + w / 2, z + d / 2] : [x - d / 2, z - w / 2, x + d / 2, z + w / 2];
    K.box(x0, y - 0.5, z0, x1, y + 0.9, z1, '#8a6a4a', 'wood', { outlineT: 0.04 });
    for (let k = 0; k < 3; k++) K.sphere(U.lerp(x0 + 0.6, x1 - 0.6, (k + 0.5) / 3), y + 1.05, (z0 + z1) / 2, 0.42, pick(r, produce), { outline: 0, seg: 5, sy: 0.6 });
    // awning on four poles
    for (const [px, pz] of [[x0, z0], [x1, z0], [x0, z1], [x1, z1]]) K.cyl(px, y, pz, 0.06, 2.6, '#4a3a2a', { outline: 0, seg: 3 });
    const aw = new THREE.BoxGeometry(alongX ? w + 0.6 : d + 1.4, 0.08, alongX ? d + 1.4 : w + 0.6);
    B.add(aw, new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(alongX ? 0.18 : 0, 0, alongX ? 0 : 0.18)).setPosition(x, y + 2.75, z), col, 'plain', { outlineT: 0.04, edges: false });
    F.box(x0, y, z0, x1, y + 2.6, z1, col);
    H.sound(x, y + 1, z, 2.2, 'crate');
    return y;
  };
  const vendors = [];
  for (let x = hx0 + 10; x < hx1 - 6; x += 9) for (const z of [hz0 + 18, hz0 + 34, hz0 + 50]) { const y = stall(x, z, true, pick(r, stallCols)); vendors.push([x, z + 1.8, Math.PI, y]); }
  // alleys around the hall: rows of stalls, lanterns strung across
  const alleys = [];
  const MX0 = 560, MX1 = 960;
  for (const z of [-250, -190, -130, 50, 110, 170, 230]) {
    const row = [];
    for (let x = MX0; x < MX1; x += 8.5) {
      if (Math.floor((x - MX0) / 68) % 2 === 1 && z % 120 !== 50) { row.push([x, z]); continue; }   // open stretches
      for (const side of [-1, 1]) {
        const sx = x, sz = z + side * 4.4;
        if (!H.clearOf(sx - 2.4, sz - 1.4, sx + 2.4, sz + 1.4, 1.5) || rectDist(CELLAR, sx, sz) < 8) continue;
        if (r() < 0.15) continue;
        const y = stall(sx, sz, true, pick(r, stallCols)); vendors.push([sx, sz + side * 1.8, side > 0 ? 0 : Math.PI, y]);
        H.reserve([sx - 2.4, sz - 1.4, sx + 2.4, sz + 1.4]);
      }
      row.push([x, z]);
    }
    if (row.length > 4) alleys.push(row);
    H.line([[MX0 - 10, z], [MX1 + 10, z]], 2.6);
    for (let x = MX0 + 14; x < MX1 - 10; x += 24) {
      if (!H.clearOf(x - 0.4, z - 7, x + 0.4, z - 6.2, 0.2) || !H.clearOf(x + 1.6, z + 6.2, x + 2.4, z + 7, 0.2)) continue;
      const y0 = terrainAt(x, z - 6.6), y1 = terrainAt(x + 2, z + 6.6);
      K.cyl(x, y0 - 0.2, z - 6.6, 0.1, 6, '#4a3a2a', { outline: 0.02, seg: 5 }); K.cyl(x + 2, y1 - 0.2, z + 6.6, 0.1, 6, '#4a3a2a', { outline: 0.02, seg: 5 });
      K.rail([[x, y0 + 5.6, z - 6.6], [x + 2, y1 + 5.6, z + 6.6]], { kind: 'cable', lanterns: true, posts: false, sag: 0.6 });
    }
  }
  // the market quarter: continuous shop facades facing each alley, cross lanes every so often
  const shopCols = ['#e0b070', '#d08a5a', '#c87a4a', '#e8c890', '#b86a4a', '#f0d8a8', '#a8c0a0', '#d8a0a0', '#e8d0b0'];
  const crossX = [620, 700, 840, 920];
  for (const z of [-250, -190, -130, 50, 110, 170, 230]) for (const side of [-1, 1]) {
    let x = R[0] + 10;
    while (x < R[2] - 10) {
      const w = 9 + r() * 8, d = 10 + r() * 6;
      if (crossX.some(c => x < c + 5 && x + w > c - 5)) { x += 4; continue; }
      const z0 = side > 0 ? z + 9 : z - 9 - d, z1 = side > 0 ? z + 9 + d : z - 9;
      if (H.clearOf(x, z0, x + w, z1, 0.4)) {
        const bb = H.bldg(x, z0, x + w, z1, 6 + r() * 7, pick(r, shopCols), { trim: '#7a4a32', outline: 0.12, kind: 'house' });

      const clip = part(new THREE.BoxGeometry(R * 0.5, R * 0.12, R * 0.12), '#d9a441', 0.01); clip.position.set(R * 0.55, R * 0.7, R * 0.55); clip.rotation.z = -0.5; head.add(clip);
      // a scarf, one end trailing
      const sc = part(new THREE.TorusGeometry(R * 0.85, R * 0.22, 6, 14), '#d9a441', T); sc.rotation.x = Math.PI / 2; sc.position.y = -R * 1.05; head.add(sc);
      const tail = part(new THREE.BoxGeometry(R * 0.4, R * 1.3, R * 0.14), '#d9a441', T); tail.position.set(R * 0.3, -R * 1.7, -R * 0.75); tail.rotation.x = 0.4; head.add(tail);
    }
  });
}

// ---------- hooks: the player's moves, answered softly by the music ----------
const hooks = {
  jump(q) { Sound.sfx.jump(q !== 'miss'); },
  push(q) { Sound.sfx.push(q !== 'miss'); },
  trick(q) {
    const b = Game.W.bell, p = Game.player.pos;
    if (b && Math.hypot(b.x - p.x, b.z - p.z) < 12 && Game.bellCD <= 0) { Sound.sfx.ringBell(); Game.bellCD = 20; }
    Sound.sfx.trick(); Game.fx.burst(V3().copy(Game.player.pos).add(V3(0, 1.2, 0)), 6, ['#f6f1e7', '#ffe9b0'], 3, 0.6, 3);
  },
  land(impact) { Sound.sfx.land(Math.min(1.4, impact / 18)); if (impact > 10) Game.fx.burst(V3().copy(Game.player.pos).add(V3(0, 0.1, 0)), 6, ['#ffffff', '#e9e4f5'], 2.5, 0.4, 4); if (impact > 24) Game.cam.shake = 0.4; },
  grindStart() { Sound.sfx.land(0.4); },
  grinding() {}, grindEnd() {}, railHop() { Sound.sfx.jump(true); },
  padLaunch() {},
  bonk() { Game.cam.shake = 0.25; Sound.sfx.land(0.6); },
  fell() { knockDown(null, true); },
  hazard(b) { knockDown(b); },
};

// a knock: the record scratches, you tumble, and the music waits for you
function knockDown(b, quiet = false) {
  if (Game.state !== 'play' || Game.hazardCD > 0 || Game.down > 0) return;
  Game.hazardCD = 2.5; Game.down = 1.4; Game.waitResume = true;
  const p = Game.player;
  if (!quiet) { Sound.knock(); Game.cam.shake = 0.6; }
  if (b && b.vx !== undefined) { p.vel.set(b.vx * 0.6, 6, b.vz * 0.6); } else p.vel.set(-p.vel.x * 0.3, 5, -p.vel.z * 0.3);
  p.mode = 'air'; p.rail = null; p.spinX += Math.PI * 2;
}
// back on your feet somewhere safe (on the metro that means the nearest platform)
function getUp() {
  const p = Game.player, W = Game.W;
  let onLine = false;
  for (let i = 0; i < W.metro.N; i += 3) { const q = W.metro.pts[i]; if (Math.hypot(q.x - p.pos.x, q.z - p.pos.z) < 7 && Math.abs(q.y - p.pos.y) < 6) { onLine = true; break; } }
  if (onLine || Game.hitByTrain) {
    let best = null, bd = 1e9; for (const st of W.stations) { const d = Math.hypot(st.p.x - p.pos.x, st.p.z - p.pos.z); if (d < bd) { bd = d; best = st; } }
    const sd = 1, o = METRO.deckW / 2 + 2.2;
    p.pos.set(best.p.x - best.p.dz * o * sd, best.platY, best.p.z + best.p.dx * o * sd); p.yaw = best.yaw;
  } else p.respawn(false);
  p.vel.set(0, 0, 0); p.mode = 'ground'; p.spinX = p.spinY = p.spinZ = 0;
  Game.cam.snap(p); Game.hitByTrain = false;
}

// ---------- boot ----------
async function boot() {
  try { await Promise.race([Promise.all([document.fonts.load('40px "Fraunces"'), document.fonts.load('20px "M PLUS Rounded 1c"')]), new Promise(r => setTimeout(r, 2000))]); } catch (e) {}
  initRenderer();
  G.dprMax = Math.min(window.devicePixelRatio || 1, U.isTouch ? 1.5 : 2); G.dpr = G.dprMax; G.renderer.setPixelRatio(G.dpr);
  Input.init();
  await new Promise(r => setTimeout(r, 30));
  const W = buildCity();
  G.scene.add(W.group);
  Game.W = W;
  const rig = makeNao(); G.scene.add(rig.root, rig.shadow); Game.rig = rig;
  Game.fx = new Particles(G.scene, 500);
  Game.player = new Player(W, rig, Game.fx, hooks);
  Game.cam = new CamRig(G.camera, W);
  Game.cam.snap(Game.player);
  Sky.init(W, 0.6);
  Life.init(W);
  W.soundGrid = makeGrid(32); W.sounds.forEach((s, i) => { s.i = i; W.soundGrid.add(s, s.x - s.r, s.z - s.r, s.x + s.r, s.z + s.r); });
  bindUI();
  if (U.isTouch) document.body.classList.add('touch');
  $('loading').hidden = true; $('title').hidden = false; Game.state = 'title';
  Game.last = performance.now();
  requestAnimationFrame(loop);
}

function bindUI() {
  const begin = () => {
    if (Game.state !== 'title') return;
    Sound.init(); Sound.start();
    $('title').hidden = true; Game.state = 'play'; Input.enabled = true; Input.flush();
    document.body.classList.add('playing');
    const p = Game.player; p.pos.copy(Game.W.spawn); p.yaw = Game.W.spawnYaw; p.vel.set(0, 0, 0); p.lastSafe.copy(p.pos);
    Game.cam.snap(p); Game.cam.yaw = p.yaw; Game.hintT = 0;
  };
  $('title').addEventListener('pointerdown', begin);
  window.addEventListener('keydown', (e) => { if (Game.state === 'title' && (e.code === 'Space' || e.code === 'Enter')) begin(); if (e.code === 'Escape' || e.code === 'KeyP') pause(Game.state === 'play'); });
  $('btnPause').onclick = () => pause(true);
  $('btnResume').onclick = () => pause(false);
  $('volMusic').oninput = (e) => Sound.setVolume(+e.target.value / 100, null);
  $('volFx').oninput = (e) => Sound.setVolume(null, +e.target.value / 100);
  $('tod').oninput = (e) => { Sky.phase = (+e.target.value / 100 + 0.0) % 1; Sky.update(0, G.camera.position); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && Game.state === 'play') pause(true); });
}
function pause(on) {
  if (on && Game.state === 'play') { Game.state = 'paused'; $('pause').hidden = false; Input.enabled = false; Sound.suspend(true); $('tod').value = Math.round(Sky.phase * 100); }
  else if (!on && Game.state === 'paused') { Game.state = 'play'; $('pause').hidden = true; Input.enabled = true; Input.flush(); Sound.suspend(false); Game.last = performance.now(); }
}

// ---------- hints: a few words at the start, then nothing ----------
const HINTS = U.isTouch ? [
  { text: 'drag on the left to skate', done: () => Game.player.speed > 6 },
  { text: 'drag on the right to look around', done: () => Math.abs(Game.cam.yaw - Game.player.yaw) > 0.8 },
  { text: 'tap the big circle to jump — on the beat goes higher', done: () => Game.player.mode === 'air' },
  { text: 'stop on a bench, or just stand still, to listen', done: () => Game.listen > 0.6, wait: 20 },
] : [
  { text: 'W A S D or the arrows to skate', done: () => Game.player.speed > 6 },
  { text: 'space to jump — on the beat goes higher · shift for a flourish', done: () => Game.player.mode === 'air' },
  { text: 'drag the mouse to look around', done: () => Math.abs(Game.cam.yaw - Game.player.yaw) > 0.8 },
  { text: 'stop on a bench, or just stand still, to listen', done: () => Game.listen > 0.6, wait: 20 },
];
function updateHints(dt) {
  if (Game.hintI >= HINTS.length) return;
  const h = HINTS[Game.hintI]; Game.hintT += dt;
  if (!Game.hintShown && Game.hintT > (Game.hintI === 0 ? 2.5 : h.wait || 2.2)) { Game.hintShown = true; Game.hintT = 0; $('hint').textContent = h.text; $('hint').classList.add('show'); }
  if (Game.hintShown && (h.done() || Game.hintT > 12)) { $('hint').classList.remove('show'); Game.hintI++; Game.hintShown = false; Game.hintT = 0; if (Game.hintI >= 3) document.body.classList.add('quiet'); }
}

// ---------- the world reacting to you ----------
const _sq = [], _dw = {};
function updateWorld(dt, bi) {
  const W = Game.W, p = Game.player, pos = p.pos;
  // things that ring as you pass
  for (const s of W.soundGrid.query(pos.x - 2, pos.z - 2, pos.x + 2, pos.z + 2, _sq)) {
    s.cd -= dt;
    const d = Math.hypot(s.x - pos.x, s.z - pos.z);
    if (d < s.r && Math.abs(s.y - pos.y) < 4 && s.cd <= 0 && (p.speed > 2.5 || s.kind === 'fountain' || s.kind === 'pond')) {
      s.cd = s.kind === 'fountain' || s.kind === 'pond' ? 2.4 : 1.4;
      Sound.sfx.touch(s.kind === 'pond' ? 'chime' : s.kind, Game.touchN = (Game.touchN || 0) + 1);
    }
  }
  // hidden spots: proximity → a local change in the music
  const spots = {};
  for (const sp of W.spots) {
    const d = Math.hypot(sp.x - pos.x, sp.z - pos.z), dy = Math.abs(sp.y - pos.y);
    let w = U.clamp(1 - d / sp.r, 0, 1); if (dy > 6) w *= U.clamp(1 - (dy - 6) / 6, 0, 1);
    sp.w = U.damp(sp.w, U.smooth(w), 2, dt);
    if (sp.w > 0.01) spots[sp.key] = sp.w;
  }
  for (const k in spots) if (k.startsWith('busk_')) spots[k] *= 0.55 + Game.listen * 0.45;
  Game.spots = spots;
  // a little chime when a train pulls in near you
  for (const T of W.trains) if (T.arrived) { T.arrived = false; const f = metroAt(W.metro, T.s, 0); if (Math.hypot(f.x - pos.x, f.z - pos.z) < 220) Sound.sfx.touch('chime'); }
  Game.bellCD = (Game.bellCD || 0) - dt;
  // fountains
  for (const f of (W.fountains || [])) {
    if (Math.hypot(f.x - G.camera.position.x, f.z - G.camera.position.z) > 220) continue;
    Game.fAcc = (Game.fAcc || 0) + dt;
    if (Game.fAcc > 0.04) { Game.fAcc = 0; for (let k = 0; k < 3; k++) Game.fx.emit(_wv.set(f.x, f.y, f.z), _wv2.set((Math.random() - 0.5) * 3, 6 + Math.random() * 2 + (bi.phase < 0.1 ? 3 : 0), (Math.random() - 0.5) * 3), Math.random() < 0.5 ? '#d8f0ff' : '#ffffff', 1.1, 11); }
  }
  // water
  let wet = null, deep = null;
  for (const w of W.waters) {
    if (!(pos.x > w.x0 && pos.x < w.x1 && pos.z > w.z0 && pos.z < w.z1)) continue;
    if (w.pond && Math.hypot(pos.x - W.pond.x, pos.z - W.pond.z) > W.pond.r * 0.72) continue;
    if (w.lake && pos.z < shoreZ(pos.x)) continue;
    if (pos.y < w.y - 0.6) { deep = w; break; }
    if (pos.y <= w.y + 0.05 && p.mode === 'ground') wet = w;
  }
  if (deep && Game.swim <= 0 && Game.state === 'play') {
    Game.swim = 1.6; Sound.sfx.splash(1.3); Sound.sfx.bubbles();
    Game.fx.burst(V3(pos.x, deep.y + 0.1, pos.z), 24, ['#bfe9ff', '#ffffff'], 6, 0.8, 10); $('fade').classList.add('on');
  }
  if (wet) {
    const sp = p.speed; if (sp > 8) { p.vel.x *= 8 / sp; p.vel.z *= 8 / sp; }
    if (sp > 1 && Math.random() < 0.6) Game.fx.emit(_wv2.set(pos.x, wet.y + 0.05, pos.z), _wv.set((Math.random() - 0.5) * 3, 2 + Math.random() * 2, (Math.random() - 0.5) * 3), '#d8f0ff', 0.5, 12);
    if (!Game.inWater) Sound.sfx.splash(Math.min(1, 0.3 + sp / 14));
  }
  Game.inWater = !!wet;
  // light shafts in the park sway a little
}
const _wv = V3(), _wv2 = V3();

// ---------- sitting and listening ----------
function updateListening(dt) {
  const p = Game.player, W = Game.W, moving = Math.hypot(Input.move.x, Input.move.y) > 0.15 || Input.kbActive || Input.jumpQ.length || Input.trickQ.length;
  if (Game.sit) {
    if (moving) { Game.sit = null; p.pos.y += 0.05; }
  } else if (p.mode === 'ground' && p.speed < 0.4 && !moving) {
    Game.still += dt;
    if (Game.still > 1.2) {
      let best = null, bd = 2.2; for (const b of W.benches) { const d = Math.hypot(b.x - p.pos.x, b.z - p.pos.z); if (d < bd && Math.abs(b.y - p.pos.y) < 1.2) { bd = d; best = b; } }
      if (best) {
        Game.sit = best;
        // face away from the bench, towards the view (downhill, or the lake)
        const ax = best.alongX ? 0 : 1, az = best.alongX ? 1 : 0;
        const down = terrainAt(best.x + ax * 6, best.z + az * 6) < terrainAt(best.x - ax * 6, best.z - az * 6) ? 1 : -1;
        p.yaw = Math.atan2(ax * down, az * down); p.pos.set(best.x, best.y, best.z);
      }
    }
  } else Game.still = 0;
  const target = Game.sit ? 1 : U.clamp((Game.still - 3.5) / 3, 0, 1);
  Game.listen = U.damp(Game.listen, target, Game.listen < target ? 0.6 : 3, dt);
  // the camera drifts back and up to take in the view
  const cam = Game.cam;
  cam.dist = 7 + Game.listen * 13;
  cam.basePitch = 0.33 + Game.listen * 0.12;
  if (Game.listen > 0.2) cam.yaw += dt * 0.035 * Game.listen;
}

// ---------- main loop ----------
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - Game.last) / 1000; Game.last = now;
  if (dt > 0.1) dt = 0.1; if (dt <= 0) dt = 0.001;
  Game.t += dt;
  const W = Game.W, p = Game.player;
  const bi = Sound.beat();
  if (Game.state === 'play') {
    Game.hazardCD = Math.max(0, Game.hazardCD - dt);
    Input.poll();
    const moving = Math.hypot(Input.move.x, Input.move.y) > 0.15 || Input.kbActive || Input.jumpQ.length > 0;
    if (Game.swim > 0) {
      Game.swim -= dt; Input.flush(); p.vel.multiplyScalar(0.9);
      if (Game.swim <= 0.6 && !Game.swimDone) { Game.swimDone = true; p.respawn(false); Game.cam.snap(p); }
      if (Game.swim <= 0) { Game.swimDone = false; $('fade').classList.remove('on'); }
    } else if (Game.down > 0) {
      Game.down -= dt; Input.flush();
      p.update(dt, Game.cam.yaw, now);
      if (Game.down <= 0) getUp();
    } else {
      if (Game.waitResume && moving) { Game.waitResume = false; Sound.resume(); }
      p.update(dt, Game.cam.yaw, now);
      // trains
      const T = W.trainsys.hits(p.pos);
      if (T && Game.hazardCD <= 0) { Game.hitByTrain = true; const b = T.boxes[0]; knockDown({ vx: b.vx, vz: b.vz }); }
      // cars and boats
      const v = Life.hits(p.pos); if (v && Game.hazardCD <= 0) knockDown(v);
    }
    updateListening(dt);
    if (Game.sit) { p.vel.set(0, 0, 0); p.pos.set(Game.sit.x, Game.sit.y, Game.sit.z); }
    Game.cam.update(dt, p);
    if (Game.sit) { Game.rig.root.position.set(Game.sit.x, Game.sit.y + 0.12, Game.sit.z); Game.rig.root.rotation.y = p.yaw; Game.rig.update(dt, Game.rig.poseTarget('sit'), { rock: 0.02 }); }
    else p.syncRig(dt, bi.phase);
    // what the music needs to know
    districtWeights(p.pos.x, p.pos.z, _dw, 140);
    Sound.setPlace(_dw, dt); Sky.S.weights = _dw;
    const ground = p.ground;
    Sound.update(dt, { speed: p.speed, grinding: p.mode === 'grind', air: p.mode === 'air' && p.airTime > 0.25, airTime: p.airTime, grounded: p.mode === 'ground', listen: Game.listen, night: Sky.night, train: ground && ground.train ? 1 : 0, under: (W.metro && p.ground && p.ground.slab && isCovered(p.pos)) ? 1 : 0, water: Game.swim > 0 ? 1 : 0, spots: Game.spots || {}, crowd: Life.crowdNear });
    updateHints(dt);
    // the name of the place, softly, when you arrive somewhere new
    if (Sound.place !== Game.lastPlace) { Game.lastPlace = Sound.place; const d = PLAN.byKey[Sound.place]; if (d && Game.t > 3) { $('place').textContent = d.name; $('place').classList.add('show'); Game.placeT = 4.5; } }
    if (Game.placeT > 0) { Game.placeT -= dt; if (Game.placeT <= 0) $('place').classList.remove('show'); }
  } else if (Game.state === 'title') {
    // a slow flight over the city
    // a slow glide high above the old town and the observatory, looking down the slope to the lake
    const a = Game.t * 0.025;
    G.camera.position.set(Math.sin(a) * 520 + 120, 230 + Math.sin(Game.t * 0.1) * 8, -1250 + Math.cos(a * 0.7) * 120);
    G.camera.lookAt(Math.sin(a) * 200, 20, 700);
  }
  if (Game.state !== 'paused') {
    for (const d of W.dyn) d.update(dt, bi);
    Life.update(dt, bi, Game.state === 'play' ? p.pos : G.camera.position);
    if (Game.state === 'play') updateWorld(dt, bi);
    Game.fx.update(dt);
    Sky.update(dt, G.camera.position);
  }
  Game.cellT = (Game.cellT || 0) - dt;
  if (Game.cellT <= 0) { Game.cellT = 0.25; W.updateCells(G.camera.position.x, G.camera.position.z, 360); }
  G.renderer.render(G.scene, G.camera);
  // adaptive resolution
  Game.dprAcc += dt; Game.dprN++;
  if (Game.dprN >= 90) {
    const avg = Game.dprAcc / Game.dprN; Game.dprAcc = 0; Game.dprN = 0;
    if (avg > 0.026 && G.dpr > 0.75) { G.dpr = Math.max(0.75, G.dpr - 0.25); G.renderer.setPixelRatio(G.dpr); onResize(); }
    else if (avg < 0.0145 && G.dpr < G.dprMax) { G.dpr = Math.min(G.dprMax, G.dpr + 0.25); G.renderer.setPixelRatio(G.dpr); onResize(); }
  }
}
function isCovered(pos) { const M = Game.W.metro; for (let i = 0; i < M.N; i += 4) { const q = M.pts[i]; if (q.covered && Math.hypot(q.x - pos.x, q.z - pos.z) < 8) return true; } return false; }

function start() { boot().catch(e => { console.error(e); const l = $('loading'); l.hidden = false; l.textContent = 'Something broke while building the city: ' + e.message; }); }
start();

// debug helper for tests: render a region from straight above
window.debugTopDown = (x0, z0, x1, z1, px = 1600) => {
  const cam = new THREE.OrthographicCamera(x0, x1, -z0, -z1, 1, 4000);
  cam.position.set(0, 1500, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0);
  for (const g of Game.W.cells.values()) g.visible = true;
  const fog = G.scene.fog; G.scene.fog = null;
  const w = px, h = Math.round(px * (z1 - z0) / (x1 - x0));
  G.renderer.setPixelRatio(1); G.renderer.setSize(w, h, false);
  G.renderer.render(G.scene, cam);
  const url = G.renderer.domElement.toDataURL('image/png');
  G.scene.fog = fog; onResize();
  return url;
};

</script>
